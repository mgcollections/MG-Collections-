<style>
:root{
  --cream:#faf5ec; --sand:#f0e6d6; --clay:#b5603a; --clay-dark:#8f4627;
  --olive:#6b6b3a; --cocoa:#3b2a20; --muted:#7d6b5d; --line:#e2d5c1; --white:#fffdf9;
  --radius:14px; --shadow:0 2px 10px rgba(59,42,32,.08); --shadow-lg:0 12px 28px rgba(59,42,32,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--cocoa);line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,.logo{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;line-height:1.15}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{max-width:100%;display:block}
.container{max-width:1150px;margin:0 auto;padding:0 20px}
main{flex:1;padding-bottom:50px}

/* Navbar */
nav{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:66px}
.logo{font-size:1.8rem;color:var(--clay-dark);letter-spacing:.5px}
.nav-links{display:flex;align-items:center;gap:22px;font-weight:500}
.nav-links a:hover{color:var(--clay)}
.cart-link{position:relative;display:flex;align-items:center;gap:6px}
.cart-link svg{width:24px;height:24px}
.badge{background:var(--clay);color:#fff;font-size:.72rem;font-weight:600;min-width:20px;height:20px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}

/* Hero */
.hero{background:linear-gradient(135deg,var(--sand),#e8d3b5);padding:70px 0;text-align:center;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);color:var(--clay-dark);margin-bottom:12px}
.hero p{font-size:1.15rem;color:var(--muted);max-width:520px;margin:0 auto 26px}

/* Buttons */
.btn{display:inline-block;background:var(--clay);color:#fff;border:none;border-radius:10px;padding:12px 24px;font-weight:600;font-size:.95rem;transition:background .2s,transform .2s,box-shadow .2s}
.btn:hover{background:var(--clay-dark);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:disabled{background:#c9bba9;cursor:not-allowed;transform:none;box-shadow:none}
.btn-outline{background:transparent;color:var(--clay-dark);border:1.5px solid var(--clay)}
.btn-outline:hover{background:var(--clay);color:#fff}
.btn-block{width:100%}
.btn.in-cart{background:var(--olive)}

/* Section */
.section-title{font-size:2rem;margin:42px 0 18px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.chip{background:var(--white);border:1.5px solid var(--line);border-radius:30px;padding:8px 18px;font-size:.9rem;font-weight:500;color:var(--muted);transition:all .2s;text-transform:capitalize}
.chip:hover{border-color:var(--clay);color:var(--clay)}
.chip.active{background:var(--clay);border-color:var(--clay);color:#fff}

/* Grid & cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px}
.card{background:var(--white);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .3s ease,box-shadow .3s ease;display:flex;flex-direction:column}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.card-img{aspect-ratio:1/1;overflow:hidden;background:var(--sand);position:relative}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.card:hover .card-img img{transform:scale(1.07)}
.tag{position:absolute;top:10px;left:10px;background:var(--cocoa);color:#fff;font-size:.72rem;padding:3px 10px;border-radius:20px}
.card-body{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--olive);font-weight:600}
.card h3{font-size:1.35rem;text-transform:capitalize}
.price{font-weight:600;color:var(--clay-dark);font-size:1.1rem}
.card .btn{margin-top:auto}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}

/* Product page */
.crumb{margin:26px 0 18px;color:var(--muted);font-size:.9rem}
.crumb a:hover{color:var(--clay)}
.product{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.gallery-main{aspect-ratio:1/1;background:var(--sand);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.gallery-main img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.thumbs img{width:70px;height:70px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer;opacity:.7;transition:all .2s;background:var(--sand)}
.thumbs img:hover,.thumbs img.active{opacity:1;border-color:var(--clay)}
.info h1{font-size:2.6rem;text-transform:capitalize;margin:6px 0 10px}
.info .price{font-size:1.7rem;margin-bottom:14px}
.info p.desc{color:var(--muted);margin-bottom:18px;font-size:1.02rem}
.stock{font-size:.9rem;margin-bottom:18px;font-weight:500}
.stock.ok{color:var(--olive)} .stock.low{color:var(--clay)} .stock.out{color:#a33}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--white)}
.qty button{width:38px;height:40px;background:transparent;border:none;font-size:1.2rem;color:var(--cocoa);transition:background .2s}
.qty button:hover{background:var(--sand)}
.qty span{min-width:40px;text-align:center;font-weight:600}
.buy-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}

/* Cart */
.cart-wrap{display:grid;grid-template-columns:1fr 330px;gap:30px;align-items:start}
.cart-item{display:grid;grid-template-columns:90px 1fr auto;gap:16px;align-items:center;background:var(--white);padding:14px;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px}
.cart-item img{width:90px;height:90px;object-fit:cover;border-radius:10px;background:var(--sand)}
.cart-item h3{font-size:1.25rem;text-transform:capitalize}
.cart-item .sub{color:var(--muted);font-size:.9rem}
.cart-actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.remove{background:none;border:none;color:#a33;font-size:.85rem;text-decoration:underline}
.summary{background:var(--white);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);position:sticky;top:90px}
.summary h3{font-size:1.5rem;margin-bottom:14px}
.row{display:flex;justify-content:space-between;margin-bottom:10px;gap:10px}
.row.total{border-top:1px solid var(--line);padding-top:12px;font-weight:600;font-size:1.15rem;color:var(--clay-dark)}
.summary .btn{margin-top:14px}

/* Checkout */
form label{display:block;font-weight:500;font-size:.9rem;margin:14px 0 6px}
form input,form textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--white);font-family:inherit;font-size:.95rem;color:var(--cocoa);transition:border-color .2s}
form input:focus,form textarea:focus{outline:none;border-color:var(--clay)}
form textarea{resize:vertical;min-height:90px}
.form-card{background:var(--white);padding:24px;border-radius:var(--radius);box-shadow:var(--shadow)}
.error{color:#a33;margin-top:12px;font-size:.92rem}
.success{text-align:center;padding:70px 20px}
.success .tick{width:70px;height:70px;border-radius:50%;background:var(--olive);color:#fff;font-size:2.2rem;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.success h1{font-size:2.4rem;margin-bottom:8px}
.success .order-box{max-width:380px;margin:20px auto;background:var(--white);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);text-align:left}
.success .order-box h3{font-size:1.3rem;margin-bottom:10px}
.success .next{max-width:460px;margin:0 auto 18px;color:var(--muted)}
.success .redirect{margin-top:18px;font-size:.85rem;color:var(--muted)}
.success .redirect a{color:var(--clay);text-decoration:underline}
.btn-wa{background:#2e7d4f}
.btn-wa:hover{background:#245f3c}
.order-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.order-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.order-head strong{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.35rem}
.order-head span{color:var(--muted);font-size:.88rem}
.status{display:inline-block;background:var(--sand);color:var(--olive);font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:20px;margin-bottom:12px}
.order-card .btn{margin-top:10px;padding:10px 18px;font-size:.88rem}
.hint{color:var(--muted);font-size:.85rem;margin-bottom:18px}
.pay-box{max-width:380px;margin:0 auto 18px;background:var(--sand);border-radius:var(--radius);padding:16px 18px;text-align:center}
.order-card .pay-box{max-width:none;margin:12px 0 0}
.copy{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:2px 10px;font-size:.8rem;color:var(--clay-dark)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.toolbar input,.toolbar select{padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--white);font-family:inherit;font-size:.95rem;color:var(--cocoa)}
.toolbar input{flex:1;min-width:180px}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--clay)}
.wa-float{position:fixed;right:18px;bottom:18px;z-index:60;background:#2e7d4f;color:#fff;border-radius:30px;padding:12px 18px;display:none;align-items:center;gap:8px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow-lg);transition:transform .2s,background .2s}
.wa-float:hover{background:#245f3c;transform:translateY(-2px)}
.wa-float svg{width:22px;height:22px}
.policy{background:var(--white);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin-bottom:16px}
.policy h3{font-size:1.5rem;margin-bottom:8px}
.policy p{color:var(--muted)}
footer a{color:#f0e6d6;text-decoration:underline}
.map-box{height:290px;border-radius:12px;border:1.5px solid var(--line);margin-top:10px;isolation:isolate;z-index:0}
.map-actions{display:flex;gap:10px;flex-wrap:wrap}
.map-actions .btn{flex:1;padding:10px 14px;font-size:.88rem;text-align:center}
.pin-wrap{background:none;border:none}
.pin{width:26px;height:26px;background:var(--clay);border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.45)}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--cocoa);color:#fff;padding:12px 22px;border-radius:30px;opacity:0;transition:all .35s;z-index:100;font-size:.92rem;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

footer{background:var(--cocoa);color:#d9c9b5;text-align:center;padding:28px 20px;font-size:.9rem}
footer .logo{color:#f0e6d6;font-size:1.5rem;display:block;margin-bottom:4px}

@media(max-width:800px){
  .product,.cart-wrap{grid-template-columns:1fr}
  .summary{position:static}
  .info h1{font-size:2.1rem}
  .hero{padding:50px 0}
}
@media(max-width:480px){
  .grid{grid-template-columns:repeat(2,1fr);gap:14px}
  .card-body{padding:12px}
  .card h3{font-size:1.1rem}
  .cart-item{grid-template-columns:70px 1fr}
  .cart-item img{width:70px;height:70px}
  .cart-actions{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  .logo{font-size:1.5rem}
  .nav-links{gap:14px}
}
</style>

<script>
/* ---------- Helpers ---------- */
const $ = (s) => document.querySelector(s);
const app = $("#app");
const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="#f0e6d6"/><text x="200" y="210" font-family="Georgia" font-size="28" fill="#b5603a" text-anchor="middle">' + CONFIG.storeName + '</text></svg>');
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n) => CONFIG.currency + Number(n).toLocaleString("en-IN");
const findProduct = (id) => PRODUCTS.find(p => p.id === id);
const resolveSrc = (src) => {
  if (src && src.startsWith("embedded:")) return (typeof EMBEDDED_IMAGES !== "undefined" && EMBEDDED_IMAGES[src.slice(9)]) || "";
  return src;
};
const imgTag = (src, alt, extra = "") =>
  `<img src="${esc(resolveSrc(src) || PLACEHOLDER)}" alt="${esc(alt)}" referrerpolicy="no-referrer" ${extra} onerror="this.onerror=null;this.src='${PLACEHOLDER}'">`;

let activeCategory = "all";
let successTimer;
let searchTerm = "", sortMode = "featured";

/* ---------- Cart (localStorage) ---------- */
function getCart() {
  try {
    const c = JSON.parse(localStorage.getItem(CONFIG.cartKey));
    return Array.isArray(c) ? c : [];
  } catch { return []; }
}
function saveCart(cart) {
  try { localStorage.setItem(CONFIG.cartKey, JSON.stringify(cart)); } catch {}
  updateBadge();
}
function inCart(id) { return getCart().some(i => i.id === id); }
function addToCart(id, qty = 1) {
  const p = findProduct(id);
  if (!p || p.stock < 1) return;
  const cart = getCart();
  const item = cart.find(i => i.id === id);
  if (item) item.qty = Math.min(item.qty + qty, p.stock);
  else cart.push({ id, qty: Math.min(qty, p.stock) });
  saveCart(cart);
  toast(`${p.name} added to cart`);
}
function setQty(id, qty) {
  const p = findProduct(id);
  let cart = getCart();
  if (qty <= 0) cart = cart.filter(i => i.id !== id);
  else { const it = cart.find(i => i.id === id); if (it) it.qty = Math.min(qty, p ? p.stock : qty); }
  saveCart(cart);
}
function cartDetailed() {
  return getCart().map(i => ({ ...i, product: findProduct(i.id) })).filter(i => i.product);
}
function cartTotal() {
  return cartDetailed().reduce((s, i) => s + i.product.price * i.qty, 0);
}
let deliv = { status: "none" };   // none | local | outside | denied
function distanceKm(lat1, lng1, lat2, lng2) {
  const R = 6371, rad = (x) => x * Math.PI / 180;
  const dLat = rad(lat2 - lat1), dLng = rad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function pinCodeState() {                // missing | mismatch | ok
  const el = $("#f-pin");
  const v = (el ? el.value : "").trim();
  if (!/^\d{6}$/.test(v)) return "missing";
  return CONFIG.localPinPrefixes.some(x => v.startsWith(x)) ? "ok" : "mismatch";
}
function deliveryQuote(sub) {            // amount: number, or null = confirmed on WhatsApp
  if (sub <= 0) return { amount: 0 };
  if (deliv.status !== "local" || pinCodeState() !== "ok") return { amount: null };
  if (CONFIG.freeDeliveryAbove && sub >= CONFIG.freeDeliveryAbove) return { amount: 0 };
  return { amount: deliv.km <= CONFIG.nearKm ? CONFIG.nearFee : CONFIG.farFee };
}
function grandTotal() { const s = cartTotal(); return s + (deliveryQuote(s).amount || 0); }
function totalsHTML(forCart) {
  const sub = cartTotal(), q = deliveryQuote(sub);
  const delText = forCart ? "Calculated at checkout" : (q.amount === null ? "Confirmed on WhatsApp" : q.amount ? money(q.amount) : "FREE");
  const hint = !forCart && q.amount > 0 && CONFIG.freeDeliveryAbove && sub < CONFIG.freeDeliveryAbove
    ? `<div class="hint" style="margin:-2px 0 10px">Add ${money(CONFIG.freeDeliveryAbove - sub)} more for free delivery</div>` : "";
  const label = (forCart || q.amount === null) ? "Total (before delivery)" : "Total";
  return `<div class="row"><span>Subtotal</span><span>${money(sub)}</span></div>
    <div class="row"><span>Delivery</span><span>${delText}</span></div>${hint}
    <div class="row total"><span>${label}</span><span>${money(forCart ? sub : sub + (q.amount || 0))}</span></div>`;
}
function refreshTotals() { const b = $("#totals-box"); if (b) b.innerHTML = totalsHTML(); }
function updateLocStatus() {
  const el = $("#loc-status"); if (!el) return;
  const q = deliveryQuote(cartTotal());
  if (deliv.status === "local" && pinCodeState() === "missing") el.textContent = `Your delivery spot is about ${deliv.km.toFixed(1)} km from our shop. Enter your 6-digit PIN code to see your delivery charge.`;
  else if (deliv.status === "local" && pinCodeState() === "mismatch") el.textContent = "That PIN code isn't a Bhagalpur PIN code, so we'll confirm the delivery charge with you on WhatsApp. Please check your PIN code and the pin on the map.";
  else if (deliv.status === "local") el.textContent = `Your delivery spot is about ${deliv.km.toFixed(1)} km from our shop. ` + (q.amount === 0 ? "Delivery is free for this order." : `Delivery: ${money(q.amount)}.`);
  else if (deliv.status === "outside") el.textContent = "That spot is outside our Bhagalpur delivery area. We'll confirm the delivery charge with you on WhatsApp.";
  else el.textContent = "Place the pin on your delivery spot to see your delivery charge. Otherwise we'll confirm it on WhatsApp. The pin location is sent with your order so we can deliver.";
}
let map = null, pinMarker = null;
function setDeliveryPoint(lat, lng) {
  const km = distanceKm(CONFIG.shopLat, CONFIG.shopLng, lat, lng);
  deliv = { status: km <= CONFIG.localMaxKm ? "local" : "outside", km, lat, lng };
  updateLocStatus(); refreshTotals();
}
function placePin(lat, lng, recenter) {
  if (!map) { setDeliveryPoint(lat, lng); return; }
  if (!pinMarker) {
    pinMarker = L.marker([lat, lng], { draggable: true, icon: L.divIcon({ className: "pin-wrap", html: '<div class="pin"></div>', iconSize: [26, 30], iconAnchor: [13, 30] }) }).addTo(map);
    pinMarker.on("dragend", () => { const p = pinMarker.getLatLng(); setDeliveryPoint(p.lat, p.lng); });
  } else {
    pinMarker.setLatLng([lat, lng]);
  }
  if (recenter) map.setView([lat, lng], Math.max(map.getZoom(), 15));
  setDeliveryPoint(lat, lng);
}
function destroyMap() {
  if (map) { try { map.remove(); } catch {} }
  map = null; pinMarker = null;
}
function initMap() {
  destroyMap();
  const el = $("#map");
  if (!el) return;
  if (typeof L === "undefined") { el.textContent = "The map could not load. We'll confirm your delivery charge on WhatsApp."; return; }
  map = L.map(el).setView([CONFIG.shopLat, CONFIG.shopLng], 12);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);
  L.circle([CONFIG.shopLat, CONFIG.shopLng], { radius: CONFIG.nearKm * 1000, color: "#b5603a", weight: 2, fillOpacity: 0.1 }).addTo(map);
  L.circle([CONFIG.shopLat, CONFIG.shopLng], { radius: CONFIG.localMaxKm * 1000, color: "#6b6b3a", weight: 1, dashArray: "6 6", fillOpacity: 0 }).addTo(map);
  L.circleMarker([CONFIG.shopLat, CONFIG.shopLng], { radius: 7, color: "#3b2a20", fillColor: "#6b6b3a", fillOpacity: 1 }).addTo(map).bindTooltip("Our shop");
  map.on("click", (e) => placePin(e.latlng.lat, e.latlng.lng, false));
  if (deliv.lat !== undefined) placePin(deliv.lat, deliv.lng, true);
  setTimeout(() => { if (map) map.invalidateSize(); }, 150);
}
async function geocode(params) {
  const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=in&" + new URLSearchParams(params).toString();
  const r = await fetch(url, { headers: { "Accept": "application/json" } });
  const j = await r.json();
  return j && j[0] ? { lat: parseFloat(j[0].lat), lng: parseFloat(j[0].lon) } : null;
}
function deliveryText(o) {
  if (o.subtotal === undefined) return "";
  return o.delivery === null ? "to be confirmed on WhatsApp" : o.delivery ? money(o.delivery) : "FREE";
}
function orderTotalsHTML(o) {
  if (o.subtotal === undefined) return `<div class="row total"><span>Total</span><span>${esc(o.total)}</span></div>`;
  const tbc = o.delivery === null;
  return `<div class="row"><span>Subtotal</span><span>${money(o.subtotal)}</span></div>
    <div class="row"><span>Delivery</span><span>${tbc ? "To be confirmed" : o.delivery ? money(o.delivery) : "FREE"}</span></div>
    <div class="row total"><span>${tbc ? "Total (before delivery)" : "Total"}</span><span>${esc(o.total)}</span></div>`;
}
function upiLink(o) {
  if (!CONFIG.upiId || !o.totalNum) return "";
  return `upi://pay?pa=${CONFIG.upiId}&pn=${encodeURIComponent(CONFIG.upiName || CONFIG.storeName)}&am=${o.totalNum}&cu=INR&tn=${encodeURIComponent("Order " + o.id)}`;
}
function payBoxHTML(o) {
  if (o.delivery === null) {
    return `<div class="pay-box"><p class="hint" style="margin:0">We'll confirm your delivery charge on WhatsApp, then share the final amount to pay.</p></div>`;
  }
  const link = upiLink(o);
  if (!link) return "";
  return `<div class="pay-box">
      <a class="btn" href="${link}">Pay ${esc(o.total)} with UPI</a>
      <p class="hint" style="margin:10px 0 0">Or pay to UPI ID <strong>${esc(CONFIG.upiId)}</strong> <button type="button" class="copy" data-copy="${esc(CONFIG.upiId)}">Copy</button><br>Please add order number ${esc(o.id)} in the payment note.</p>
    </div>`;
}
function updateBadge() {
  $("#cart-count").textContent = getCart().reduce((s, i) => s + i.qty, 0);
}
function getOrders() {
  try {
    const o = JSON.parse(localStorage.getItem(CONFIG.ordersKey));
    return Array.isArray(o) ? o : [];
  } catch { return []; }
}
function saveOrder(order) {
  try {
    const list = getOrders();
    list.unshift(order);
    localStorage.setItem(CONFIG.ordersKey, JSON.stringify(list.slice(0, 50)));
  } catch {}
}
function waLink(order) {
  const wa = String(CONFIG.whatsappNumber || "").replace(/\D/g, "");
  if (!wa) return "";
  const msg = `Hi ${CONFIG.storeName}, about my order ${order.id}.\n` +
    order.lines.map(l => `${l.name} × ${l.qty} = ${l.amount}`).join("\n") +
    `\nDelivery: ${deliveryText(order)}\nTotal: ${order.total}\nName: ${order.name}`;
  return `https://wa.me/${wa}?text=${encodeURIComponent(msg)}`;
}
let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ---------- Components ---------- */
function cardHTML(p) {
  const out = p.stock < 1;
  const added = inCart(p.id);
  return `

function filteredProducts() {

  if (q) list = list.filter(p => (p.name + " " + p.description + " " + p.category).toLowerCase().includes(q));
  if (sortMode === "low") list.sort((a, b) => a.price - b.price);
  if (sortMode === "high") list.sort((a, b) => b.price - a.price);
  return list;
}

/* ---------- Checkout submit ---------- */
async function submitOrder(form) {
  const err = $("#form-error"), btn = $("#place-btn");
  err.textContent = "";
  const data = Object.fromEntries(new FormData(form).entries());
  if (!data.name.trim() || !data.email.trim() || !data.phone.trim() || !data.address.trim()) {
    err.textContent = "Please fill in all required fields."; return;
  }
  if (!/^\S+@\S+\.\S+$/.test(data.email)) { err.textContent = "Please enter a valid email address."; return; }
  if (!/^\d{6}$/.test((data.pin || "").trim())) { err.textContent = "Please enter a valid 6-digit PIN code."; return; }
  const items = cartDetailed();
  const orderId = "MG" + Date.now().toString(36).toUpperCase().slice(-6);
  const order = {
    id: orderId, date: new Date().toISOString(), name: data.name.trim(), subtotal: cartTotal(), delivery: deliveryQuote(cartTotal()).amount, totalNum: grandTotal(), total: money(grandTotal()),
    lines: items.map(i => ({ name: i.product.name, qty: i.qty, amount: money(i.product.price * i.qty) }))
  };
  const payload = {
    store: CONFIG.storeName,
    order_id: orderId,
    name: data.name, email: data.email, phone: data.phone,
    address: data.address, pin_code: data.pin.trim(), notes: data.notes || "",
    order: items.map(i => `${i.product.name} (ID ${i.id}) × ${i.qty} = ${money(i.product.price * i.qty)}`).join("\n"),
    items: JSON.stringify(items.map(i => ({ id: i.id, name: i.product.name, price: i.product.price, qty: i.qty }))),
    subtotal: money(order.subtotal),
    delivery: order.delivery === null ? "To be confirmed on WhatsApp" : (order.delivery ? money(order.delivery) : "FREE"),
    distance_from_shop_km: deliv.km !== undefined ? deliv.km.toFixed(1) : "pin not placed",
    delivery_pin_location: deliv.lat !== undefined ? `https://www.google.com/maps?q=${deliv.lat},${deliv.lng}` : "pin not placed",
    delivery_check: deliv.status === "local" && pinCodeState() !== "ok" ? "CHECK: pin is in Bhagalpur but the PIN code does not start with 812/813 - please verify the address" : "ok",
    total: order.total
  };
  btn.disabled = true; btn.textContent = "Placing order…";
  try {
    const res = await fetch(CONFIG.formspreeUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error("Request failed");
    saveCart([]);
    saveOrder(order);
    deliv = { status: "none" };
    renderSuccess(order);
    clearTimeout(successTimer);
    successTimer = setTimeout(() => { location.hash = "#/"; }, CONFIG.redirectSeconds * 1000);
  } catch {
    err.textContent = "Sorry, something went wrong sending your order. Please try again.";
    btn.disabled = false; btn.textContent = "Place Order";
  }
}

/* ---------- Router ---------- */
function route() {
  clearTimeout(successTimer);
  destroyMap();
  const hash = location.hash || "#/";
  const parts = hash.replace(/^#\/?/, "").split("/");
  if (parts[0] === "product" && parts[1]) renderProduct(decodeURIComponent(parts[1]));
  else if (parts[0] === "cart") renderCart();
  else if (parts[0] === "orders") renderOrders();
  else if (parts[0] === "about") renderAbout();
  else if (parts[0] === "checkout") renderCheckout();
  else renderHome();
  updateBadge();
  if (parts[0] !== "product" && parts[0] !== "checkout") window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* ---------- Event delegation ---------- */
document.addEventListener("click", (e) => {
  const t = e.target;

  const add = t.closest("[data-add]");
  if (add) {                       // Add to Cart from card — never navigates
    e.stopPropagation();
    addToCart(add.dataset.add);
    add.textContent = "In Cart ✓"; add.classList.add("in-cart");
    return;
  }
  const pdpAdd = t.closest("[data-pdp-add]");
  if (pdpAdd) {
    addToCart(pdpAdd.dataset.pdpAdd, productQty);
    pdpAdd.textContent = "In Cart ✓ (add more)";
    return;
  }
  const q = t.closest("[data-q]");
  if (q) {
    const id = location.hash.split("/")[2];
    const p = findProduct(decodeURIComponent(id || ""));
    const max = p ? Math.max(p.stock, 1) : 1;
    productQty = Math.min(max, Math.max(1, productQty + Number(q.dataset.q)));
    $("#pqty").textContent = productQty;
    return;
  }
  if (t.closest("#find-btn")) {
    const address = $("#f-address").value.trim(), pin = $("#f-pin").value.trim();
    const st = $("#loc-status");
    if (!address && !pin) { st.textContent = "Please enter your address and PIN code first."; return; }
    st.textContent = "Searching…";
    (async () => {
      try {
        let hit = address ? await geocode({ q: `${address}, ${pin}` }) : null;
        if (!hit && /^\d{6}$/.test(pin)) hit = await geocode({ postalcode: pin });
        const el = $("#loc-status"); if (!el) return;
        if (hit) { placePin(hit.lat, hit.lng, true); el.textContent += " Drag the pin to your exact delivery spot if needed."; }
        else el.textContent = "We couldn't find that address. Tap the map to place the pin on your delivery spot.";
      } catch {
        const el = $("#loc-status");
        if (el) el.textContent = "Search isn't available right now. Tap the map to place the pin on your delivery spot.";
      }
    })();
    return;
  }
  if (t.closest("#loc-btn")) {
    const st = $("#loc-status");
    if (!navigator.geolocation) { st.textContent = "Your browser can't share location. Tap the map to place the pin."; return; }
    st.textContent = "Finding your location…";
    navigator.geolocation.getCurrentPosition(
      (pos) => placePin(pos.coords.latitude, pos.coords.longitude, true),
      () => { const el = $("#loc-status"); if (el) el.textContent = "We couldn't get your location. Search your address or tap the map to place the pin."; },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
    );
    return;
  }
  const share = t.closest("[data-share]");
  if (share) {
    const p = findProduct(share.dataset.share);
    const text = `${p.name} - ${money(p.price)} at ${CONFIG.storeName}`;
    if (navigator.share) {
      navigator.share({ title: p.name, text, url: location.href }).catch(() => {});
    } else {
      window.open("https://wa.me/?text=" + encodeURIComponent(text + "\n" + location.href), "_blank", "noopener");
    }
    return;
  }
  const copy = t.closest("[data-copy]");
  if (copy) {
    const v = copy.dataset.copy;
    (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => toast("UPI ID copied")).catch(() => toast("Long-press the UPI ID to copy it"));
    return;
  }
  const thumb = t.closest("[data-thumb]");
  if (thumb) {
    const id = decodeURIComponent(location.hash.split("/")[2] || "");
    const p = findProduct(id);
    $("#gallery-main").innerHTML = imgTag(p.images[Number(thumb.dataset.thumb)], p.name);
    document.querySelectorAll("[data-thumb]").forEach(el => el.classList.toggle("active", el === thumb));
    return;
  }
  const cq = t.closest("[data-cq]");
  if (cq) {
    const item = getCart().find(i => i.id === cq.dataset.cq);
    if (item) setQty(item.id, item.qty + Number(cq.dataset.d));
    renderCart(); return;
  }
  const rm = t.closest("[data-remove]");
  if (rm) { setQty(rm.dataset.remove, 0); renderCart(); return; }

  const cat = t.closest("[data-cat]");
  if (cat) { activeCategory = cat.dataset.cat; renderHome(); document.getElementById("shop").scrollIntoView(); return; }

  if (t.closest("[data-scroll]")) {
    e.preventDefault();
    document.getElementById("shop").scrollIntoView({ behavior: "smooth" });
    return;
  }
  const card = t.closest("[data-open]");
  if (card) location.hash = "#/product/" + encodeURIComponent(card.dataset.open);
});
