/* ---------- Going to the shop part of the home page, from any page ---------- */
let afterHome = null;                    // something to do once the home page is on screen
function scrollToShop() { const s = document.getElementById("shop"); if (s) s.scrollIntoView(); }
function focusSearch() {
  const s = $("#search"); if (!s) return;
  s.scrollIntoView({ block: "center" });
  try { s.focus({ preventScroll: true }); } catch { s.focus(); }
}
function paintShop() {                   // refresh only the chips and the grid, so the slider does not restart
  const g = $("#grid-wrap"); if (!g) return false;
  g.innerHTML = gridHTML();
  document.querySelectorAll("#shop .chip").forEach(c => c.classList.toggle("active", c.dataset.cat === activeCategory));
  return true;
}
function goHome(then) {
  afterHome = then;
  if ((location.hash || "#/") === "#/") route(); else location.hash = "#/";
}
function showCategory(c) {
  activeCategory = c;
  if ((location.hash || "#/") === "#/" && paintShop()) { scrollToShop(); return; }
  goHome(scrollToShop);
}
function goSearch() {
  if ((location.hash || "#/") === "#/" && $("#search")) { focusSearch(); return; }
  goHome(focusSearch);
}

/* ---------- Home slider ----------
   The slides come from the Slides tab of the sheet (the Banners page in Admin). A slide hides itself when its
   dates have passed, or when the product or category it opens is sold out. While the first-order offer is live
   it gets the first slide. The slide itself is one link, so tapping anywhere on it opens the product or category.
   The sliding is the browser's own scroll-snap, so swiping is native and nothing heavy runs in the background. */
let SLIDES = [];
const SLIDE_MAX = 5;
const SLIDE_MAX_PHOTOS = 3;                                            // photos on one slide (1 or 2 looks best)
const SL_THEMES = ["dark", "cream", "clay", "wine", "forest", "navy", "black", "gold", "blush", "sage", "white"];
const SL_FONTS = ["elegant", "classic", "modern", "clean", "script", "caps", "hindi"];
const SL_FONT_FILES = { classic: "Playfair+Display:wght@600", script: "Dancing+Script:wght@700", caps: "Cinzel:wght@600", hindi: "Noto+Serif+Devanagari:wght@600" };   // the others are already on the page
const slHex = (t) => /^#[0-9a-f]{6}$/.test(t);
const slThemeOk = (t) => SL_THEMES.includes(t) || slHex(t);
function slLum(h) {                        // how light a colour is (0 = black, 1 = white)
  const c = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function slThemeAttrs(t) {                 // a named colour is a CSS class; the owner's own colour sets the same variables, with whichever text colour reads best
  if (SL_THEMES.includes(t)) return { cls: "sl-" + t, css: "", style: "" };
  if (!slHex(t)) return { cls: "sl-dark", css: "", style: "" };
  const L = slLum(t), light = "#fffdf9", dark = "#2b1d14";
  const cw = 1.03 / (L + 0.05), cd = (L + 0.05) / 0.065;
  const fg = Math.max(cw, cd) < 4.5 ? (cw >= (L + 0.05) / 0.05 ? "#ffffff" : "#000000") : (cw >= cd ? light : dark);   // a middle grey needs pure white or black to stay easy to read
  const css = `--sl-bg:${t};--sl-fg:${fg};--sl-eb:${fg};--sl-rule:${fg};--sl-btn:${fg};--sl-btnfg:${t}`;
  return { cls: "sl-custom", css, style: ` style="${css}"` };
}
const SL_LOADED = new Set();
function slLoadFonts(list) {               // an extra heading font is fetched from Google Fonts only when a slide (or the editor) uses it
  [].concat(list).forEach(f => {
    const q = SL_FONT_FILES[f]; if (!q || SL_LOADED.has(f)) return;
    SL_LOADED.add(f);
    const l = document.createElement("link"); l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?family=" + q + "&display=swap";
    document.head.appendChild(l);
  });
}
const istToday = () => new Date(Date.now() + 330 * 60000).toISOString().slice(0, 10);   // today's date in India
const prodPic = (p) => firstAvailable(p).photo || p.images[0] || "";
const newestInStock = (list, n) => list.filter(p => p.stock > 0).slice(-n).reverse();    // the sheet lists new designs last
function liveSlides() {
  const today = istToday(), out = [];
  if (OFFER.live) {
    out.push({
      theme: "cream", font: "elegant", eyebrow: "First order offer", headline: `${OFFER.pct}% off your first order`,
      msg: (OFFER.maxOff ? `Up to ${money(OFFER.maxOff)} off. ` : "") + (OFFER.minOrder ? `On orders of ${money(OFFER.minOrder)} or more. ` : "") + "Enter the code at checkout.",
      cta: "Start shopping", href: "", cat: "all", code: OFFER.code,
      pics: newestInStock(CATALOG, 2).map(prodPic).filter(Boolean)
    });
  }
  for (const s of SLIDES) {
    if (out.length >= SLIDE_MAX) break;
    if (!s || !s.headline) continue;
    if (s.from && today < s.from) continue;
    if (s.until && today > s.until) continue;
    let pics = (Array.isArray(s.photos) ? s.photos : []).filter(Boolean).slice(0, SLIDE_MAX_PHOTOS), href = "", cat = "all";
    if (s.opens === "product") {
      const p = findProduct(String(s.target || ""));
      if (!p || p.stock < 1) continue;                             // sold out or removed: the slide hides itself
      href = "#/product/" + encodeURIComponent(p.id);
      if (!pics.length) pics = p.images.filter(Boolean).slice(0, 3);
    } else if (s.opens === "category") {
      const want = String(s.target || "").trim().toLowerCase();
      const items = CATALOG.filter(p => p.category.toLowerCase() === want);
      if (!items.some(p => p.stock > 0)) continue;
      cat = items[0].category;
      if (!pics.length) pics = newestInStock(items, 3).map(prodPic).filter(Boolean);
    } else if (!pics.length) pics = newestInStock(CATALOG, 3).map(prodPic).filter(Boolean);
    out.push({
      theme: slThemeOk(s.theme) ? s.theme : "dark", font: SL_FONTS.includes(s.font) ? s.font : "elegant", eyebrow: s.eyebrow || "", headline: s.headline,
      msg: s.msg || "", cta: s.cta || "Shop now", href, cat, code: "", pics
    });
  }
  return out;
}
function slideHTML(s, i, n) {
  const k = s.pics.length, th = slThemeAttrs(s.theme);
  const media = k
    ? `<div class="sl-media">${s.pics.map((src, j) => imgTag(sized(src, k === 1 ? 900 : 600), j ? "" : s.headline, (i === 0 && j === 0 ? 'fetchpriority="high"' : 'loading="lazy"') + ' decoding="async" draggable="false"')).join("")}</div>`
    : `<div class="sl-media empty"><svg class="sl-mono" viewBox="0 0 459.6 208.8" aria-hidden="true"><use href="#mg-mono"/></svg></div>`;
  const go = s.href ? `href="${esc(s.href)}"` : `href="#/" data-cat="${esc(s.cat)}"`;
  return `<a class="sl-slide ${th.cls} slf-${s.font || "elegant"}"${th.style} ${go} draggable="false" aria-label="${esc(`${s.headline}. ${s.cta}. Slide ${i + 1} of ${n}`)}">
    <div class="sl-text">
      ${s.eyebrow ? `<span class="sl-eyebrow">${esc(s.eyebrow)}</span>` : ""}
      <h2>${esc(s.headline)}</h2>
      <span class="sl-rule"></span>
      ${s.msg ? `<p>${esc(s.msg)}</p>` : ""}
      ${s.code ? `<span class="sl-code">${esc(s.code)}</span>` : ""}
      <span class="sl-cta">${esc(s.cta)}</span>
    </div>
    ${media}
  </a>`;
}
function sliderHTML(list) {
  const n = list.length;
  return `<section class="slider${n > 1 ? "" : " one"}" id="slider" aria-roledescription="carousel" aria-label="What's new">
    <div class="sl-track" id="sl-track">${list.map((s, i) => slideHTML(s, i, n)).join("")}</div>
    ${n > 1 ? `<button type="button" class="sl-arrow sl-prev" data-sl="-1" aria-label="Previous slide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button type="button" class="sl-arrow sl-next" data-sl="1" aria-label="Next slide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="sl-bar">${list.map((s, i) => `<button type="button" class="sl-dot${i ? "" : " on"}" data-sl-go="${i}" aria-label="Go to slide ${i + 1}"${i ? "" : ' aria-current="true"'}></button>`).join("")}<button type="button" class="sl-pp" data-sl-pp aria-label="Pause slideshow"><svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button></div>` : ""}
  </section>`;
}
const SL = { track: null, n: 0, i: 0, timer: 0, raf: 0, rs: 0, held: false, paused: false, visible: true, io: null };
const SL_EVERY = 5500;                                                // milliseconds on each slide
const slReduced = () => !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
function slStop() {
  clearTimeout(SL.timer); cancelAnimationFrame(SL.raf); SL.raf = 0;
  if (SL.io) { SL.io.disconnect(); SL.io = null; }
  SL.track = null; SL.n = 0;
}
const slWidth = () => (SL.track ? SL.track.clientWidth : 0);
function slIndex() { const w = slWidth(); return w ? Math.max(0, Math.min(SL.n - 1, Math.round(SL.track.scrollLeft / w))) : 0; }
function slPaint() {
  SL.i = slIndex();
  document.querySelectorAll("#slider .sl-dot").forEach((d, k) => {
    d.classList.toggle("on", k === SL.i);
    if (k === SL.i) d.setAttribute("aria-current", "true"); else d.removeAttribute("aria-current");
  });
}
function slGo(k, instant) {
  if (!SL.track || !SL.n) return;
  k = ((k % SL.n) + SL.n) % SL.n;
  SL.track.scrollTo({ left: k * slWidth(), behavior: instant || slReduced() ? "auto" : "smooth" });
}
function slStep(d) {                     // past the last slide it jumps back to the first instead of sweeping through them all
  const k = slIndex() + d;
  slGo(k, k < 0 || k >= SL.n);
}
const slCanPlay = () => !!SL.track && SL.n > 1 && !SL.paused && !SL.held && SL.visible && !document.hidden && !slReduced();
function slSchedule() {                  // (re)start the wait for the next slide; does nothing while playing is not allowed
  clearTimeout(SL.timer);
  if (slCanPlay()) SL.timer = setTimeout(() => { slStep(1); slSchedule(); }, SL_EVERY);
}
function slTogglePause() {
  SL.paused = !SL.paused;
  const b = $("[data-sl-pp]");
  if (b) { b.classList.toggle("paused", SL.paused); b.setAttribute("aria-label", SL.paused ? "Play slideshow" : "Pause slideshow"); }
  slSchedule();
}
function slInit() {
  slStop();
  const track = $("#sl-track"), box = $("#slider");
  if (!track || !box) return;
  SL.track = track; SL.n = track.children.length; SL.i = 0; SL.held = false; SL.visible = true;
  if (SL.n < 2) return;
  if (SL.paused) { const b = $("[data-sl-pp]"); if (b) { b.classList.add("paused"); b.setAttribute("aria-label", "Play slideshow"); } }
  track.addEventListener("scroll", () => {      // update the dots at most once per frame; any movement restarts the wait
    if (SL.raf) return;
    SL.raf = requestAnimationFrame(() => { SL.raf = 0; if (SL.track !== track) return; slPaint(); slSchedule(); });
  }, { passive: true });
  const hold = () => { SL.held = true; clearTimeout(SL.timer); }, free = () => { SL.held = false; slSchedule(); };
  box.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") hold(); });
  box.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") free(); });
  track.addEventListener("touchstart", hold, { passive: true });
  track.addEventListener("touchend", free, { passive: true });
  track.addEventListener("touchcancel", free, { passive: true });
  box.addEventListener("focusin", (e) => { if (e.target.matches && e.target.matches(":focus-visible")) hold(); });   // keyboard users only
  box.addEventListener("focusout", free);
  if ("IntersectionObserver" in window) {       // never moves while it is off screen
    SL.io = new IntersectionObserver((es) => { SL.visible = es[es.length - 1].isIntersecting; slSchedule(); }, { threshold: 0.2 });
    SL.io.observe(box);
  }
  setTimeout(() => {                            // the other slides' photos start loading once the first screen has settled
    if (SL.track === track) track.querySelectorAll('img[loading="lazy"]').forEach(im => { if (im.offsetParent) im.loading = "eager"; });
  }, 2500);
  slSchedule();
}
document.addEventListener("visibilitychange", slSchedule);
window.addEventListener("resize", () => {
  clearTimeout(SL.rs);
  SL.rs = setTimeout(() => { if (SL.track) SL.track.scrollLeft = SL.i * slWidth(); }, 150);
}, { passive: true });

let galleryIndex = 0, productQty = 1, selectedSku = "";
function currentProduct() { return findProduct(decodeURIComponent((location.hash.split("/")[2] || ""))); }
function selectedVariant(p) { return p.variants.find(v => v.sku === selectedSku) || firstAvailable(p); }
/* Updates the parts of the product page that depend on the chosen colour */
function paintVariant() {
  const p = currentProduct(); if (!p || !$("#pdp-price")) return;
  const v = selectedVariant(p);
  selectedSku = v.sku;
  productQty = Math.min(Math.max(1, productQty), Math.max(1, v.stock));
  const out = v.stock < 1;
  $("#pdp-price").textContent = money(v.price);
  const st = $("#pdp-stock");
  st.className = "stock " + (out ? "out" : v.stock <= 3 ? "low" : "ok");
  st.textContent = out ? (v.colour ? `${v.colour} is out of stock` : "Out of stock") : v.stock <= 3 ? `Only ${v.stock} left in stock` : "In stock";
  $("#pqty").textContent = productQty;
  const add = $("#pdp-add");
  add.disabled = out;
  add.textContent = out ? "Sold Out" : (inCart(v.sku) ? "In Cart ✓ (add more)" : "Add to Cart");
  const buy = $("#pdp-buy"); if (buy) buy.disabled = out;
  const nw = $("#notify-wrap"), nl = $("#pdp-notify");
  if (nw && nl) { const h = out ? notifyHref(p, v) : ""; nw.hidden = !h; if (h) nl.href = h; }
  document.querySelectorAll("[data-colour]").forEach(el => el.classList.toggle("active", el.dataset.colour === v.sku));
  const lbl = $("#colour-name"); if (lbl) lbl.textContent = v.colour;
  if (v.photo) {
    const idx = p.images.indexOf(v.photo);
    $("#gallery-main").innerHTML = imgTag(v.photo, variantName(p, v));
    document.querySelectorAll("[data-thumb]").forEach(el => el.classList.toggle("active", Number(el.dataset.thumb) === idx));
  }
}
function renderProduct(id) {
  const p = findProduct(id);
  if (!p) { app.innerHTML = `<div class="container empty"><h2>Product not found</h2><br><a class="btn" href="#/">Back to shop</a></div>`; return; }
  galleryIndex = 0; productQty = 1;
  const v0 = firstAvailable(p);
  selectedSku = v0.sku;
  const hasColours = p.variants.some(v => v.colour);
  const related = CATALOG.filter(x => x.id !== p.id && x.category === p.category);
  const relList = related.length ? related : CATALOG.filter(x => x.id !== p.id);
  app.innerHTML = `
    <div class="container">
      <div class="crumb"><a href="#/">Home</a> / <span style="text-transform:capitalize">${esc(p.category)}</span> / ${esc(p.name)}</div>
      <div class="product">
        <div class="gal-col">
          ${wishBtnHTML(p)}
          <div class="gallery-main" id="gallery-main">${imgTag(v0.photo || p.images[0], p.name)}</div>
          ${p.images.length > 1 ? `<div class="thumbs">${p.images.map((im, i) => imgTag(sized(im, 200), p.name + " " + (i + 1), `data-thumb="${i}" class="${im === v0.photo ? "active" : ""}"`)).join("")}</div>` : ""}
        </div>
        <div class="info">
          <span class="cat">${esc(p.category)}</span>
          <h1>${esc(p.name)}</h1>
          <div class="price" id="pdp-price">${money(v0.price)}</div>
          <p class="desc">${esc(p.description)}</p>
          ${hasColours ? `<div class="colour-label">Colour: <strong id="colour-name">${esc(v0.colour)}</strong></div>
          <div class="colours">${p.variants.map(v => `<button type="button" class="colour ${v.stock < 1 ? "gone" : ""}" data-colour="${esc(v.sku)}" title="${v.stock < 1 ? "Out of stock" : ""}">${esc(v.colour || "Standard")}</button>`).join("")}</div>` : ""}
          <div class="stock" id="pdp-stock"></div>
          <div class="notify-wrap" id="notify-wrap" hidden><a class="btn btn-outline btn-block" id="pdp-notify" target="_blank" rel="noopener" href="#" style="text-align:center">Notify me when it's back</a><p>Tap it and WhatsApp opens with the message ready. We'll tell you when it is back.</p></div>
          <p class="hint" style="margin:-8px 0 16px">${esc(deliveryTimeText())} ${esc(deliveryRangeNote())}</p>
          <div class="buy-row">
            <div class="qty">
              <button data-q="-1" aria-label="Decrease">−</button>
              <span id="pqty">1</span>
              <button data-q="1" aria-label="Increase">+</button>
            </div>
            <button class="btn btn-outline" data-share="${esc(p.id)}">Share</button>
          </div>
          <div class="buy-actions">
            <button class="btn btn-outline" id="pdp-add" data-pdp-add="1">Add to Cart</button>
            <button class="btn btn-buy" id="pdp-buy" data-pdp-buy="1">Buy Now</button>
          </div>
        </div>
      </div>
      ${productReviewsHTML(p)}
      ${relList.length ? `<h2 class="section-title">You may also like</h2><div class="grid">${relList.slice(0, 4).map(cardHTML).join("")}</div>` : ""}
    </div>`;
  paintVariant();
  window.scrollTo(0, 0);
}

/* "Back" links: the cart goes back to wherever the customer was last browsing (home or a product) */
let lastShopHash = "#/";
function backLink(href, label) {
  return `<a class="back-link" href="${esc(href)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>${label}</a>`;
}

function renderCart() {
  const items = cartDetailed();
  const note = cartNotice ? `<div class="notice" role="alert">${esc(cartNotice)}</div>` : "";
  cartNotice = "";
  if (!items.length) {
    app.innerHTML = `<div class="container empty" style="padding-top:80px">${note}<h2 style="font-size:2.2rem">Your cart is empty</h2><p style="margin:10px 0 22px">Find something you love.</p><a class="btn" href="#/">Continue Shopping</a></div>`;
    return;
  }
  app.innerHTML = `
    <div class="container">
      ${backLink(lastShopHash, "Continue shopping")}
      <h2 class="section-title">Your Cart</h2>
      ${note}
      <div class="cart-wrap">
        <div>
          ${items.map(i => `
            <div class="cart-item">
              <a href="#/product/${encodeURIComponent(i.product.id)}">${imgTag(sized(i.variant.photo || i.product.images[0], 300), variantName(i.product, i.variant), 'loading="lazy" decoding="async"')}</a>
              <div>
                <h3><a href="#/product/${encodeURIComponent(i.product.id)}">${esc(i.product.name)}</a></h3>
                ${i.variant.colour ? `<div class="sub">Colour: <strong>${esc(i.variant.colour)}</strong></div>` : ""}
                <div class="sub">${money(i.variant.price)} each</div>
                <div class="price" style="margin-top:4px">${money(i.variant.price * i.qty)}</div>
              </div>
              <div class="cart-actions">
                <div class="qty">
                  <button data-cq="${esc(i.id)}" data-d="-1" aria-label="Decrease">−</button>
                  <span>${i.qty}</span>
                  <button data-cq="${esc(i.id)}" data-d="1" aria-label="Increase">+</button>
                </div>
                <button class="remove" data-remove="${esc(i.id)}">Remove</button>
              </div>
            </div>`).join("")}
        </div>
        <div class="summary">
          <h3>Order Summary</h3>
          <div class="row"><span>Items</span><span>${items.reduce((s, i) => s + i.qty, 0)}</span></div>
          ${totalsHTML(true)}
          <a href="#/checkout" class="btn btn-block" style="text-align:center">Proceed to Checkout</a>
          <a href="#/" class="btn btn-outline btn-block" style="text-align:center;margin-top:10px">Continue Shopping</a>
        </div>
      </div>
    </div>`;
}

            <label class="pay-opt"><input type="radio" name="payment" value="upi" checked><span><b>Pay online with UPI</b><small>Pay right after you place the order, in any UPI app</small></span></label>
            ${CONFIG.codEnabled ? `<label class="pay-opt" id="cod-opt"><input type="radio" name="payment" value="cod"><span><b>Cash on delivery</b><small id="cod-note">Pay in cash when your order arrives (Bhagalpur only)</small></span></label>` : ""}
          </div>

          <textarea id="f-notes" name="notes"></textarea>

        </form>
        <div class="summary">
          <h3>Order Summary</h3>
          ${items.map(i => `<div class="row"><span>${esc(variantName(i.product, i.variant))} × ${i.qty}</span><span>${money(i.variant.price * i.qty)}</span></div>`).join("")}

/* ---------- Checkout submit ---------- */
async function submitOrder(form) {
  const err = $("#form-error"), btn = $("#place-btn");
  err.textContent = "";
  const data = Object.fromEntries(new FormData(form).entries());
  const v = (k) => String(data[k] || "").trim();
  if (!v("name") || !v("email") || !v("phone") || !v("building") || !v("street") || !v("city")) {
    err.textContent = "Please fill in all required fields."; return;
  }
  if (!/^\S+@\S+\.\S+$/.test(v("email"))) { err.textContent = "Please enter a valid email address."; return; }
  if (!/^\d{6}$/.test(v("pin"))) { err.textContent = "Please enter a valid 6-digit PIN code."; return; }
  const quote = deliveryQuote(cartTotal());
  const payment = v("payment") === "cod" && CONFIG.codEnabled ? "cod" : "upi";
  if (payment === "cod" && (areaZone() === "outside" || quote.state === "pincheck")) { err.textContent = "Cash on delivery is available only for addresses in Bhagalpur. Please choose UPI."; return; }
  if (quote.state === "choose") { err.textContent = "Please choose your nearest chowk / area so we can show your delivery charge."; return; }
  if (quote.state === "pincheck") { err.textContent = "That PIN code isn't a Bhagalpur PIN code. Please check it, or choose \"Outside Bhagalpur\" as your area."; return; }
  const items = cartDetailed();
  const fullAddress = (id) => `${v("building")}, ${v("street")}, ${v("city")} - ${v("pin")}` + ` (Nearest area: ${areaLabel()}${v("landmark") ? `; Landmark: ${v("landmark")}` : ""})`;
  const lineText = (i) => `${variantName(i.product, i.variant)} [${i.product.id}] × ${i.qty} = ${money(i.variant.price * i.qty)}`;
  const formspreePayload = (orderId, order) => ({
    store: CONFIG.storeName,
    order_id: orderId,
    name: v("name"), email: v("email"), phone: v("phone"),
    address: order.address,
    flat_floor_building: v("building"), street_locality: v("street"), city: v("city"),
    nearest_landmark: v("landmark") || "not given", pin_code: v("pin"), notes: v("notes"),
    order: items.map(lineText).join("\n"),
    items: JSON.stringify(items.map(i => ({ sku: i.id, name: variantName(i.product, i.variant), price: i.variant.price, qty: i.qty }))),
    subtotal: money(order.subtotal),
    delivery_area: areaLabel(), payment: order.payment === "cod" ? "Cash on delivery" : "UPI",
    delivery: order.delivery === null ? "To be confirmed on WhatsApp" : (order.delivery ? money(order.delivery) : "FREE"),
    total: order.total + (order.delivery === null ? " (before delivery)" : "")
  });
  const finish = (order) => {
    saveCart([]);
    saveOrder(order);
    renderSuccess(order);
    clearTimeout(successTimer);
    if (order.payment === "cod" || order.delivery === null) successTimer = setTimeout(() => { location.hash = "#/"; }, CONFIG.redirectSeconds * 1000);   // stay on the page while the customer pays
  };
  const placeNote = $("#place-note");
  const failReset = (msg) => { err.textContent = msg; btn.disabled = false; btn.textContent = "Place Order"; if (placeNote) placeNote.hidden = true; };
  btn.disabled = true; btn.textContent = "Placing order…";
  if (placeNote) { placeNote.textContent = "Saving your order. This takes a few seconds, please don't close this page."; placeNote.hidden = false; }
  setTimeout(() => { const n = $("#place-note"); if (n && !n.hidden) n.textContent = "Still saving your order. Please wait, and don't press the button again. You will not be charged twice."; }, 7000);

  /* ----- With the Google Sheet: the sheet checks stock + prices, reduces stock, saves the order and sends the emails ----- */
  if (SHEET_MODE) {
    const sig = JSON.stringify([items.map(i => [i.id, i.qty]), v("email"), v("phone"), areaValue(), v("pin"), APPLIED]);
    if (!lastAttempt || lastAttempt.sig !== sig) lastAttempt = { sig, id: "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8) };   // same id on a retry = never a double order
    const body = {
      action: "order", requestId: lastAttempt.id,
      customer: { name: v("name"), email: v("email"), phone: v("phone"), building: v("building"), street: v("street"), city: v("city"), landmark: v("landmark"), pin: v("pin"), notes: v("notes") },
      area: areaValue(), payment,
      items: items.map(i => ({ sku: i.id, qty: i.qty })),
      expectedSubtotal: cartTotal(), expectedDelivery: quote.amount, deviceId: deviceId()
    };
    const wantDisc = offerDiscount(cartTotal());
    if (APPLIED && wantDisc > 0) { body.offerCode = APPLIED; body.expectedDiscount = wantDisc; }
    let res;
    try {
      const r = await fetch(CONFIG.sheetApiUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
      res = await r.json();
    } catch {
      failReset("Sorry, we couldn't reach the shop just now. Please check your internet and press Place Order again. You will not be charged twice."); return;
    }
    if (!res || !res.ok) {
      if (res && (res.error === "stock" || res.error === "changed")) {
        lastAttempt = null;
        cartNotice = res.error === "stock"
          ? "Sorry, someone just bought some of these. " + (res.problems || []).map(pr => pr.reason === "stock"
              ? `${pr.name}${pr.colour ? " (" + pr.colour + ")" : ""}: ${pr.available > 0 ? "only " + pr.available + " left" : "sold out"}`
              : "one item is no longer available").join("; ") + ". We've updated your cart."
          : "Some prices or delivery charges were just updated. Please check your cart and order again.";
        await loadCatalog(); reconcileCart();
        if (location.hash === "#/cart") route(); else location.hash = "#/cart";     // the hash change draws the cart (once)
        return;
      }
      if (res && res.error === "offer") {                        // the code was refused: take it off so the order can go through at the normal price
        lastAttempt = null; APPLIED = ""; saveApplied(); paintCodeState(); refreshTotals();
        failReset((res.message || "The discount code could not be used.") + " We have taken the code off. Please check your new total and press Place Order again, or press Cancel and shop on.");
        return;
      }
      failReset((res && res.message) || "Sorry, something went wrong placing your order. Please try again.");
      return;
    }
    lastAttempt = null;
    APPLIED = ""; saveApplied();
    (res.stock || []).forEach(s => { const f = findVariant(s.sku); if (f) { f.variant.stock = s.stock; finishProduct(f.product); } });
    saveCatalogCache();
    const order = {
      id: res.orderId, date: new Date().toISOString(), name: v("name"), address: res.address,
      phone: v("phone"), zone: areaZone(), discount: res.discount || 0, code: res.offerCode || "",
      subtotal: res.subtotal, delivery: res.delivery, totalNum: res.total, total: money(res.total), payment: res.payment === "Cash on delivery" ? "cod" : "upi",
      lines: res.lines.map(l => ({ name: l.name + (l.colour ? " – " + l.colour : ""), qty: l.qty, amount: money(l.amount) }))
    };
    if (CONFIG.alsoSendToFormspree && CONFIG.formspreeUrl) {
      fetch(CONFIG.formspreeUrl, { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify(formspreePayload(order.id, order)) }).catch(() => {});
    }
    finish(order);
    return;
  }

  /* ----- Old way (no sheet): order goes to Formspree ----- */
  const orderId = "MG" + Date.now().toString(36).toUpperCase().slice(-6);
  const order = {
    id: orderId, date: new Date().toISOString(), name: v("name"), address: fullAddress(),
    subtotal: cartTotal(), delivery: quote.amount, totalNum: grandTotal(), total: money(grandTotal()), payment,
    lines: items.map(i => ({ name: variantName(i.product, i.variant), qty: i.qty, amount: money(i.variant.price * i.qty) }))
  };
  try {
    const res = await fetch(CONFIG.formspreeUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(formspreePayload(orderId, order))
    });
    if (!res.ok) throw new Error("Request failed");
    finish(order);
  } catch {
    failReset("Sorry, something went wrong sending your order. Please try again.");
  }
}
let lastAttempt = null, cartNotice = "";

/* ---------- Catalogue from the Google Sheet ---------- */
let catalogLoaded = false, catalogLoading = false;
function applyFeed(feed, fromCache) {
  CATALOG = buildCatalog(feed.products || []);
  SLIDES = Array.isArray(feed.slides) ? feed.slides : [];
  if (!fromCache) wishPrune();
  REVIEWS = feed.reviews && Array.isArray(feed.reviews.list) ? feed.reviews : { count: 0, avg: 0, list: [] };
  if (!fromCache) {                       // the offer is only trusted when it arrives live from the sheet
    OFFER = feed.offer && feed.offer.live ? feed.offer : { live: false };
    if (APPLIED && !(OFFER.live && APPLIED === OFFER.code)) { APPLIED = ""; saveApplied(); }
  }
  const s = feed.settings || {};
  ["nearAreaFee", "otherBhagalpurFee", "outsideFee", "freeDeliveryAbove"].forEach(k => { if (Number.isFinite(Number(s[k])) && s[k] !== null && s[k] !== "") CONFIG[k] = Number(s[k]); });
  if (Array.isArray(s.bhagalpurPinPrefixes) && s.bhagalpurPinPrefixes.length) CONFIG.bhagalpurPinPrefixes = s.bhagalpurPinPrefixes.flatMap(x => { x = String(x).trim(); return /^\d+$/.test(x) && x.length > 3 && x.length % 3 === 0 ? x.match(/\d{3}/g) : [x]; });
  if (Array.isArray(s.nearAreaPins) && s.nearAreaPins.length) CONFIG.nearAreaPins = s.nearAreaPins.flatMap(x => { x = String(x).trim(); return /^\d+$/.test(x) && x.length > 6 && x.length % 6 === 0 ? x.match(/\d{6}/g) : [x]; });
  if (typeof s.cod === "boolean") CONFIG.codEnabled = s.cod;
  ["cancelLocalHrs", "cancelOutsideHrs"].forEach(k => { if (s[k] !== undefined && s[k] !== null && s[k] !== "" && Number.isFinite(Number(s[k])) && Number(s[k]) >= 0) CONFIG[k] = Number(s[k]); });
  if (Array.isArray(feed.areas) && feed.areas.length) DELIVERY_AREAS.splice(0, DELIVERY_AREAS.length, ...feed.areas);
  catalogLoaded = true;
  paintNavLinks(); wishPaint();
}
function catalogAsFeed() {
  const rows = [];
  CATALOG.forEach(p => p.variants.forEach(v => rows.push({ sku: v.sku, code: p.id, name: p.name, category: p.category, colour: v.colour, price: v.price, stock: v.stock, photo: v.photo, description: p.description })));
  return { ok: true, products: rows, settings: { nearAreaFee: CONFIG.nearAreaFee, otherBhagalpurFee: CONFIG.otherBhagalpurFee, outsideFee: CONFIG.outsideFee, freeDeliveryAbove: CONFIG.freeDeliveryAbove, bhagalpurPinPrefixes: CONFIG.bhagalpurPinPrefixes, nearAreaPins: CONFIG.nearAreaPins, cod: CONFIG.codEnabled, cancelLocalHrs: CONFIG.cancelLocalHrs, cancelOutsideHrs: CONFIG.cancelOutsideHrs }, areas: DELIVERY_AREAS.slice(), reviews: REVIEWS, slides: SLIDES };
}
function saveCatalogCache() {
  if (!SHEET_MODE || !CATALOG.length) return;
  try { localStorage.setItem(CATALOG_CACHE_KEY, JSON.stringify(catalogAsFeed())); } catch {}
}
function readCatalogCache() {
  try { const f = JSON.parse(localStorage.getItem(CATALOG_CACHE_KEY)); return f && Array.isArray(f.products) && f.products.length ? f : null; } catch { return null; }
}
async function loadCatalog() {          // true = fresh data arrived
  if (!SHEET_MODE) return true;
  catalogLoading = true;
  try {
    const early = window.__feed; window.__feed = null;          // the request that started at the top of the page (used once)
    let feed = null;
    if (early) { try { feed = await early; } catch { feed = null; } }
    if (!feed || !feed.ok || !Array.isArray(feed.products)) {    // no early answer (or it failed): ask again the normal way
      const url = CONFIG.sheetApiUrl + (CONFIG.sheetApiUrl.includes("?") ? "&" : "?") + "action=products&_=" + Date.now();
      const r = await fetch(url);
      feed = await r.json();
    }
    if (!feed || !feed.ok || !Array.isArray(feed.products)) throw new Error("bad feed");
    applyFeed(feed);
    saveCatalogCache();
    return true;
  } catch { return false; }
  finally { catalogLoading = false; }
}

const cleanCode = (s) => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 20);

function deviceId() {
  try {
    let d = localStorage.getItem("mg-device");
    if (!/^[A-Za-z0-9]{12,64}$/.test(d || "")) {
      const bytes = new Uint8Array(12);
      if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(bytes); else for (let i = 0; i < 12; i++) bytes[i] = Math.floor(Math.random() * 256);
      d = Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join("");

}
function offerDiscount(sub) {              // same rule as the server

  let off = Math.floor(sub * OFFER.pct / 100);

}
const offerShortLine = () => OFFER.live ? `First order? Use code ${OFFER.code} for ${OFFER.pct}% off${OFFER.maxOff ? ` (up to ${money(OFFER.maxOff)})` : ""}` : "";
const offerTerms = () => !OFFER.live ? "" : `${OFFER.pct}% off your first order${OFFER.maxOff ? `, up to ${money(OFFER.maxOff)}` : ""}${OFFER.minOrder ? `, on orders of ${money(OFFER.minOrder)} or more` : ""}. One use per customer${OFFER.endsText ? `. Ends ${OFFER.endsText}` : ""}.`;
const offerScarcity = () => OFFER.live && typeof OFFER.left === "number" && OFFER.left <= 10 ? `Only ${OFFER.left} left` : "";
/* ---------- The moving offer banner ----------
   The same line is repeated in two equal halves. The strip slides left by exactly half its own width and then
   starts again, which looks like one endless loop with no jump. Each half is made wider than the screen so
   there is never a gap. Only "transform" moves, so scrolling and tapping on the rest of the page stay smooth. */
const ANN = { key: "", k: 0, w: 0, dur: 0, wired: false };

  const first = track.firstElementChild; if (!first) return;
  const w = first.getBoundingClientRect().width;
  const vw = el.clientWidth || window.innerWidth || 360;
  if (!(w > 0)) return;
  const k = Math.max(1, Math.min(12, Math.ceil((vw + 40) / w)));   // each half is at least a screen wide, plus a little spare
  const dur = Math.max(10, Math.round(((k * w) / ANN_SPEED) * 10) / 10);
  if (k === ANN.k && Math.abs(dur - ANN.dur) < Math.max(1, ANN.dur * 0.04)) return;   // nothing worth changing
  const want = 2 * k;
  while (track.children.length > want) track.lastElementChild.remove();
  while (track.children.length < want) { const c = first.cloneNode(true); c.setAttribute("aria-hidden", "true"); track.appendChild(c); }

function annWire(el) {                                  // listeners are added once, not on every repaint

  el.addEventListener("pointerdown", hold(true), { passive: true });
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => el.addEventListener(ev, hold(false), { passive: true }));

const LIVE_KEY = CONFIG.ordersKey + " status";

  const left = cancelMinutesLeft(live);

  const id = esc(o.id), paid = /Paid/.test(live.payment || "") || live.status === "Paid";

async function doCancel(id) {
  const o = getOrders().find(x => x.id === id); if (!o || !o.phone || CANCELLING) return;
  CANCEL_ASK = ""; CANCELLING = id; delete CANCEL_NOTE[id]; paintOrders();
  try {
    const r = await fetch(CONFIG.sheetApiUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "cancel", orderId: id, phone: o.phone }) });
    const j = await r.json();

      LIVE[id] = { status: "Cancelled", payment: (LIVE[id] || {}).payment, reviewed: false, cancelLeft: 0, at: Date.now() }; saveLive();
      toast("Your order " + id + " is cancelled.", 5000);

      CANCEL_NOTE[id] = (j && j.message) || "Sorry, we could not cancel this order. Please message us on WhatsApp.";

function paintOrders() {
  const box = $("#orders-box"); if (!box) return;
  const ae = document.activeElement;
  if (ae && box.contains(ae) && ae.tagName === "INPUT") return;       // don't wipe what the customer is typing
  box.innerHTML = getOrders().map(orderCardHTML).join("");
  const u = $("#orders-updated");
  if (u) u.textContent = liveFailed ? "Couldn't refresh. Showing the last known status." : liveAt ? "Updated just now" : "";
}
setInterval(() => { if (location.hash === "#/orders" && !document.hidden && !CANCELLING) paintOrders(); }, 30000);     // keeps the "time left to cancel" honest
function renderOrders() {
  const orders = getOrders();
  if (!orders.length) {
    app.innerHTML = `<div class="container empty" style="padding-top:80px"><h2 style="font-size:2.2rem">No orders yet</h2><p style="margin:10px 0 22px">Orders you place on this device will show up here.</p><a class="btn" href="#/">Start Shopping</a></div>`;
    return;
  }
  app.innerHTML = `
    <div class="container">
      ${backLink("#/", "Back to shop")}
      <h2 class="section-title">My Orders</h2>
      <p class="hint">Orders are saved on this phone/browser only. Clearing your browser data removes them.</p>
      ${SHEET_MODE ? `<p class="hint"><button type="button" class="linkbtn" data-refresh-status>Refresh status</button> <span id="orders-updated" aria-live="polite"></span></p>` : ""}
      <div id="orders-box"></div>
    </div>`;
  paintOrders();
  refreshStatuses();
}
async function verifyPhone(form) {
  const id = form.dataset.vp, inp = form.querySelector("input"), msg = form.querySelector(".vp-msg"), btn = form.querySelector("button");
  const phone = inp.value.trim();
  if (phone.replace(/\D/g, "").length < 10) { msg.textContent = "Please type your 10-digit phone number."; return; }
  btn.disabled = true; msg.textContent = "Checking…";
  try {
    const res = await trackCall([{ id, phone }]);
    const x = res && res.ok && res.orders && res.orders[0];
    if (!x) { msg.textContent = "That phone number doesn't match this order. Please check it."; btn.disabled = false; return; }
    updateOrder(id, { phone });
    LIVE[id] = liveFrom(x); saveLive(); liveAt = Date.now();
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
    paintOrders();
  } catch { msg.textContent = "Couldn't reach the shop. Please try again."; btn.disabled = false; }
}

/* ---------- Customer reviews ---------- */
const starsHTML = (n) => { n = Math.max(0, Math.min(5, Math.round(n))); return `<span class="stars" role="img" aria-label="${n} out of 5 stars">${"★".repeat(n)}<i>${"★".repeat(5 - n)}</i></span>`; };
function reviewCardHTML(r) {
  return `<figure class="rv-card">${starsHTML(r.r)}
    ${r.t ? `<blockquote>${esc(r.t)}</blockquote>` : ""}
    <figcaption><b>${esc(r.n)}</b>${r.p ? `<span>${esc(r.p)}</span>` : ""}${r.d ? `<span>${esc(r.d)}</span>` : ""}</figcaption></figure>`;
}
let showAllReviews = false;
function homeReviewsHTML() {
  if (!REVIEWS.count) return "";
  const list = showAllReviews ? REVIEWS.list : REVIEWS.list.slice(0, 6);
  return `<div class="container" id="reviews"><h2 class="section-title">What customers say</h2>
    <p class="rv-sum">${starsHTML(REVIEWS.avg)} <b>${Number(REVIEWS.avg).toFixed(1)}</b> out of 5 · ${REVIEWS.count} review${REVIEWS.count > 1 ? "s" : ""}</p>
    <div class="rv-grid">${list.map(reviewCardHTML).join("")}</div>
    ${REVIEWS.list.length > 6 && !showAllReviews ? `<p style="text-align:center;margin-top:20px"><button type="button" class="btn btn-outline" data-more-reviews>Show more reviews</button></p>` : ""}
  </div>`;
}
function productReviewsHTML(p) {
  const name = String(p.name).toLowerCase();
  const list = (REVIEWS.list || []).filter(r => String(r.p || "").toLowerCase().includes(name)).slice(0, 4);
  if (!list.length) return "";
  const avg = list.reduce((s, r) => s + r.r, 0) / list.length;
  return `<h2 class="section-title">Reviews of this design</h2>
    <p class="rv-sum">${starsHTML(avg)} <b>${avg.toFixed(1)}</b> · ${list.length} review${list.length > 1 ? "s" : ""}</p>
    <div class="rv-grid">${list.map(reviewCardHTML).join("")}</div>`;
}

function paintStars() { document.querySelectorAll("[data-star]").forEach(b => { const on = Number(b.dataset.star) <= reviewRating; b.classList.toggle("on", on); b.setAttribute("aria-checked", Number(b.dataset.star) === reviewRating ? "true" : "false"); }); }
async function submitReview(form) {
  const id = decodeURIComponent((location.hash.split("/")[2] || "")), err = $("#rv-err"), btn = $("#rv-btn");
  err.textContent = "";
  const phone = $("#rv-phone").value.trim();
  if (!reviewRating) { err.textContent = "Please tap the stars to rate your order."; return; }
  if (phone.replace(/\D/g, "").length < 10) { err.textContent = "Please type the phone number you used for this order."; return; }
  btn.disabled = true; btn.textContent = "Sending…";
  try {
    const r = await fetch(CONFIG.sheetApiUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "review", orderId: id, phone, rating: reviewRating, text: $("#rv-text").value.trim() }) });
    const res = await r.json();
    if (!res || !res.ok) { err.textContent = (res && res.message) || "Sorry, we couldn't send your review. Please try again."; btn.disabled = false; btn.textContent = "Send review"; return; }
    updateOrder(id, { phone }); if (LIVE[id]) { LIVE[id].reviewed = true; saveLive(); }
    form.outerHTML = `<div class="form-card" style="text-align:center"><div class="tick" style="margin:0 auto 14px">✓</div><h3 style="font-size:1.7rem">Thank you!</h3><p class="hint" style="margin:8px 0 18px">Your review has reached us. It will appear on the site once we have read it.</p><a class="btn" href="#/">Back to shop</a></div>`;
  } catch { err.textContent = "Couldn't reach the shop. Please check your internet and try again."; btn.disabled = false; btn.textContent = "Send review"; }
}

/* ---------- Router ---------- */
let lastWarm = 0;
function warmServer() {                 // a tiny request so the Google server is awake (and the connection open) when the customer presses Place Order
  if (!SHEET_MODE || Date.now() - lastWarm < 120000) return;
  lastWarm = Date.now();
  try { fetch(CONFIG.sheetApiUrl + (CONFIG.sheetApiUrl.includes("?") ? "&" : "?") + "action=ping&_=" + Date.now()).catch(() => {}); } catch {}
}
function route() {
  clearTimeout(successTimer);
  slStop();
  const hash = location.hash || "#/";
  if (hash === "#/" || /^#\/product\//.test(hash)) lastShopHash = hash;
  const parts = hash.replace(/^#\/?/, "").split("/");
  document.body.classList.toggle("on-admin", parts[0] === "admin");
  if (SHEET_MODE && !catalogLoaded && !STATIC_PAGES.includes(parts[0]) && parts[0] !== "orders" && parts[0] !== "admin" && parts[0] !== "review") { renderCatalogWait(); updateBadge(); return; }
  if (parts[0] === "product" && parts[1]) renderProduct(decodeURIComponent(parts[1]));
  else if (parts[0] === "cart") { renderCart(); warmServer(); }
  else if (parts[0] === "orders") renderOrders();
  else if (parts[0] === "about") renderAbout();
  else if (parts[0] === "faq") renderFaq();
  else if (parts[0] === "privacy") renderPrivacy();
  else if (parts[0] === "terms") renderTerms();
  else if (parts[0] === "returns") renderReturns();
  else if (parts[0] === "review") renderReview(decodeURIComponent(parts[1] || ""));
  else if (parts[0] === "checkout") { renderCheckout(); warmServer(); }
  else if (parts[0] === "wishlist") renderWishlist();
  else if (parts[0] === "admin") renderAdmin();
  else if (parts[0] === "pay") renderPay(decodeURIComponent(parts[1] || ""), parts[2]);
  else renderHome();
  updateBadge();
  const todo = afterHome;
  if (todo && !parts[0] && (catalogLoaded || !SHEET_MODE)) { afterHome = null; todo(); return; }       // e.g. "go to the shop part" or "focus the search box"
  if (parts[0] !== "product" && parts[0] !== "checkout") window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* ---------- Event delegation ---------- */
document.addEventListener("click", (e) => {
  const t = e.target;

  if (t.closest("[data-retry]")) {
    catalogLoading = true; renderCatalogWait();
    loadCatalog().then(() => route());
    return;
  }
  if (t.closest("[data-code-btn]")) { if (APPLIED) removeCode(); else applyCodeFromInput(); return; }
  const useCode = t.closest("[data-code-use]");
  if (useCode) { const i = $("#f-code"); if (i) i.value = useCode.dataset.codeUse; applyCodeFromInput(useCode.dataset.codeUse); return; }
  const copyCode = t.closest("[data-copycode]");
  if (copyCode) { const c = copyCode.dataset.copycode; (navigator.clipboard ? navigator.clipboard.writeText(c) : Promise.reject()).then(() => toast("Code " + c + " copied. Use it at checkout.")).catch(() => toast("Your code is " + c)); return; }
  const cAsk = t.closest("[data-cancel-ask]"); if (cAsk) { CANCEL_ASK = cAsk.dataset.cancelAsk; paintOrders(); return; }
  if (t.closest("[data-cancel-no]")) { CANCEL_ASK = ""; paintOrders(); return; }
  const cYes = t.closest("[data-cancel-yes]"); if (cYes) { doCancel(cYes.dataset.cancelYes); return; }
  if (t.closest("[data-refresh-status]")) { liveFailed = false; refreshStatuses().then(() => toast("Status updated")); return; }
  if (t.closest("[data-more-reviews]")) { showAllReviews = true; const h = $("#reviews"); if (h) { h.outerHTML = homeReviewsHTML(); } return; }
  const star = t.closest("[data-star]");
  if (star) { reviewRating = Number(star.dataset.star); paintStars(); return; }
  const add = t.closest("[data-add]");
  if (add) {                       // Add to Cart from card: never leaves the page. The button turns into  - 1 +  (quantity) right there
    e.stopPropagation();
    const sku = add.dataset.add;
    if (addToCart(sku, 1, true)) refreshCardBtns(sku, "plus"); else toast("Sorry, this one just sold out");
    return;
  }
  const cardq = t.closest("[data-cardq]");
  if (cardq) {                     // - or + on a card
    e.stopPropagation();
    const sku = cardq.dataset.sku, d = Number(cardq.dataset.cardq), cur = cartQty(sku), f = findVariant(sku);
    if (d > 0 && f && cur >= f.variant.stock) { toast(f.variant.stock === 1 ? "Only 1 available" : `Only ${f.variant.stock} available`); return; }
    setQty(sku, cur + d);
    refreshCardBtns(sku, cur + d <= 0 ? "add" : d > 0 ? "plus" : "minus");       // keyboard focus stays on the button that was pressed
    if (cur + d <= 0) toast("Removed from your cart");
    return;
  }
  if (t.closest("[data-stepper]")) { e.stopPropagation(); return; }       // tapping the number does nothing (it must not open the product page)
  const buy = t.closest("[data-buy]");
  if (buy) {                       // Buy Now from a card: straight to checkout. If it is not in the cart yet, one is added; if it is, the cart stays as the customer set it
    e.stopPropagation();
    const sku = buy.dataset.buy;
    if (cartQty(sku) > 0 || addToCart(sku, 1, true)) location.hash = "#/checkout";
    return;
  }
  const colourBtn = t.closest("[data-colour]");
  if (colourBtn) { selectedSku = colourBtn.dataset.colour; productQty = 1; paintVariant(); return; }
  const pdpAdd = t.closest("[data-pdp-add]");
  if (pdpAdd) {
    if (addToCart(selectedSku, productQty)) pdpAdd.textContent = "In Cart ✓ (add more)";
    return;
  }
  const pdpBuy = t.closest("[data-pdp-buy]");
  if (pdpBuy) {                    // Buy Now on the product page: the chosen colour and quantity, straight to checkout
    if (addToCart(selectedSku, productQty, true)) location.hash = "#/checkout";
    return;
  }
  const q = t.closest("[data-q]");
  if (q) {
    const p = currentProduct();
    const max = p ? Math.max(selectedVariant(p).stock, 1) : 1;
    productQty = Math.min(max, Math.max(1, productQty + Number(q.dataset.q)));
    $("#pqty").textContent = productQty;
    return;
  }
  const share = t.closest("[data-share]");
  if (share) {
    const p = findProduct(share.dataset.share);
    const text = `${p.name} - ${p.priceVaries ? "from " : ""}${money(p.price)} at ${CONFIG.storeName}`;
    if (navigator.share) {
      navigator.share({ title: p.name, text, url: location.href }).catch(() => {});
    } else {
      window.open("https://wa.me/?text=" + encodeURIComponent(text + "\n" + location.href), "_blank", "noopener");
    }
    return;
  }
  const copy = t.closest("[data-copy]");
  if (copy) {
    const v = copy.dataset.copy;
    (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => toast("UPI ID copied")).catch(() => toast("Long-press the UPI ID to copy it"));
    return;
  }
  const thumb = t.closest("[data-thumb]");
  if (thumb) {
    const p = currentProduct();
    $("#gallery-main").innerHTML = imgTag(p.images[Number(thumb.dataset.thumb)], p.name);
    document.querySelectorAll("[data-thumb]").forEach(el => el.classList.toggle("active", el === thumb));
    return;
  }
  const cq = t.closest("[data-cq]");
  if (cq) {
    const item = getCart().find(i => i.id === cq.dataset.cq);
    if (item) setQty(item.id, item.qty + Number(cq.dataset.d));
    renderCart(); return;
  }
  const rm = t.closest("[data-remove]");
  if (rm) { setQty(rm.dataset.remove, 0); renderCart(); return; }

  const cat = t.closest("[data-cat]");
  if (cat) { e.preventDefault(); showCategory(cat.dataset.cat); return; }
  const wishBtn = t.closest("[data-wish]");
  if (wishBtn) { e.preventDefault(); e.stopPropagation(); wishToggle(wishBtn.dataset.wish); return; }
  if (t.closest("[data-search]")) { goSearch(); return; }
  const slBtn = t.closest("[data-sl]");
  if (slBtn) { slStep(Number(slBtn.dataset.sl)); return; }
  const slDot = t.closest("[data-sl-go]");
  if (slDot) { slGo(Number(slDot.dataset.slGo)); return; }
  if (t.closest("[data-sl-pp]")) { slTogglePause(); return; }

  if (t.closest("[data-scroll]")) {
    e.preventDefault();
    document.getElementById("shop").scrollIntoView({ behavior: "smooth" });
    return;
  }
  const card = t.closest("[data-open]");
  if (card) location.hash = "#/product/" + encodeURIComponent(card.dataset.open);
});

document.addEventListener("input", (e) => {
  if (e.target.id === "f-pin") { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6); refreshTotals(); updateAreaHint(); }   // digits only
  if (["f-building", "f-street", "f-city", "f-landmark", "f-pin"].includes(e.target.id)) updateAreaWa();
  if (e.target.id === "search") { searchTerm = e.target.value; $("#grid-wrap").innerHTML = gridHTML(); }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "f-area") {
    const city = $("#f-city");
    if (city && !city.value.trim() && areaZone() !== "outside" && areaZone() !== "none") city.value = "Bhagalpur";
    refreshTotals(); updateAreaHint(); updateAreaWa();
  }
  if (e.target.id === "sort") { sortMode = e.target.value; $("#grid-wrap").innerHTML = gridHTML(); }
});

document.addEventListener("submit", (e) => {
  if (e.target.id === "checkout-form") { e.preventDefault(); submitOrder(e.target); }
  if (e.target.id === "rv-form") { e.preventDefault(); submitReview(e.target); }
  if (e.target.dataset && e.target.dataset.vp) { e.preventDefault(); verifyPhone(e.target); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.id === "f-code") { e.preventDefault(); if (!APPLIED) applyCodeFromInput(); } });
document.addEventListener("visibilitychange", () => { if (!document.hidden && location.hash === "#/orders") refreshStatuses(); });

/* ---------- Init ---------- */
window.addEventListener("DOMContentLoaded", () => {
  document.title = CONFIG.storeName + " — " + CONFIG.tagline;
  $("#logo-text").textContent = CONFIG.storeName.replace(/^\s*MG\s+/i, "");
  paintAnnounce();
  wishPaint();
  if (CONFIG.instagram) { const fi = $("#foot-ig"); fi.href = igUrl(); fi.innerHTML = IG_ICON + "Instagram"; fi.title = "@" + CONFIG.instagram; fi.style.display = "block"; fi.style.overflowWrap = "anywhere"; }
  $("#footer-name").textContent = CONFIG.storeName;
  $("#footer-tag").textContent = CONFIG.tagline;
  if (CONFIG.contactEmail) { const fm = $("#foot-mail"); fm.href = "mailto:" + CONFIG.contactEmail; fm.textContent = CONFIG.contactEmail; fm.style.display = "block"; fm.style.fontSize = ".8rem"; fm.style.overflowWrap = "anywhere"; }
  $("#footer-copy").textContent = "© " + new Date().getFullYear() + " " + CONFIG.storeName;
  const waNum = String(CONFIG.whatsappNumber || "").replace(/\D/g, "");
  if (waNum) {
    const fl = $("#wa-float");
    fl.href = `https://wa.me/${waNum}?text=${encodeURIComponent("Hi " + CONFIG.storeName + ", I have a question.")}`;
    fl.style.display = "flex";
    const fw = $("#foot-wa"); if (fw) fw.href = `https://wa.me/${waNum}?text=${encodeURIComponent("Hi " + CONFIG.storeName + ", I have a question.")}`;
  }
  if (CONFIG.googleAnalyticsId) {
    const s = document.createElement("script");
    s.async = true;
    s.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(CONFIG.googleAnalyticsId);
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); };
    gtag("js", new Date());
    gtag("config", CONFIG.googleAnalyticsId);
  }
  if (!SHEET_MODE) { CATALOG = staticCatalog(); paintNavLinks(); route(); return; }
  // With the sheet: show the last known catalogue instantly (if any), then refresh stock in the background
  const cached = readCatalogCache();
  if (cached) { applyFeed(cached, true); route(); }
  else { catalogLoading = true; route(); }
  loadCatalog().then(ok => {
    if (!ok) { if (!catalogLoaded) route(); return; }
    if (reconcileCart()) toast("Your cart was updated to match what's in stock");
    const h = location.hash || "#/";
    const stat = STATIC_PAGES.some(k => h === "#/" + k);
    if (h === "#/" || h === "" || h.startsWith("#/cart") || h.startsWith("#shop") || stat) route(); else if (!cached) route(); else updateBadge();
    refreshOfferUI();
  });
});
</script>
