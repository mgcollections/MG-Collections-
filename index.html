<script>
/* =====================================================
   CONFIG — edit these
   ===================================================== */
const CONFIG = {
  storeName: "MG Collections",
  tagline: "Jewellery collections that you love",
  heroImage: "",                      // optional: a photo for the top of the home page, e.g. "hero.jpg" (upload the file next to index.html). Leave "" to use the photo of your first product.
  formspreeUrl: "https://formspree.io/f/mgaalndp",
  // Google Sheet system (products, colours, automatic stock, orders). Paste your Apps Script "Web app URL" here.
  // While this is "" the site works the old way: products from PRODUCTS below, orders by Formspree.
  sheetApiUrl: "https://script.google.com/macros/s/AKfycbwcDyYbs-pX4EbE6rxp18oc9XS8eGcB6rWjWUV7sCrS0iIpJ9HqnCdwsdWjZxMwA0V8/exec",
  alsoSendToFormspree: false,   // with the sheet on: true = ALSO send a copy of every order to Formspree (you would get two emails)
  currency: "₹",
  cartKey: "MG Collections",
  ordersKey: "MG Collections orders",
  contactEmail: "mgcollectionsbgp26@gmail.com",   // shown in the Contact section and the footer. Leave "" to hide it.
  instagram: "mg_collection_bhagalpur",   // your Instagram name, no @. Leave "" to hide it.
  deliveryDays: "1 to 2 days",        // shown as "Delivery in Bhagalpur takes 1 to 2 days"
  whatsappNumber: "917033612418",     // e.g. "919876543210" (country code + number, no + or spaces). Leave "" to hide the WhatsApp button
  redirectSeconds: 45,    // how long the order confirmation stays before going back to the shop
  upiId: "257692953001812@cnrb",
  upiName: "MG Collections",
  upiHolder: "",                      // optional: the name the payer's UPI app shows for this UPI ID (leave empty if you are not sure)
  useAppButtons: true,                // true = one-tap Google Pay / PhonePe / Paytm / BHIM buttons with the amount filled in. If a bank refuses them ("limit exceeded") for a personal UPI ID, customers use the "Pay with the UPI ID instead" backup under the buttons. false = UPI ID + QR only.
  codEnabled: true,                   // Cash on delivery option (Bhagalpur only). The Settings tab of the sheet can switch it off.
  // Delivery charges. The customer picks their area at checkout and sees the charge BEFORE ordering.
  nearAreaFee: 49,            // for the chowks / areas listed in DELIVERY_AREAS below
  otherBhagalpurFee: 89,     // any other area in Bhagalpur
  outsideFee: 0,              // outside Bhagalpur: one flat charge, e.g. 120. Leave 0 to say "confirmed on WhatsApp before dispatch"
  freeDeliveryAbove: 999,     // free delivery inside Bhagalpur on orders of this amount or more. Set 0 for no free delivery
  bhagalpurPinPrefixes: ["812", "813"],   // PIN codes that count as Bhagalpur
  nearAreaPins: ["812001", "812002"],     // the lower delivery fee (nearAreaFee) applies ONLY to these PIN codes
  cancelLocalHrs: 2,                      // a customer can cancel their own order for this many hours (Bhagalpur). The Settings tab of the sheet can change it. 0 = not allowed
  cancelOutsideHrs: 4,                    // the same, for orders outside Bhagalpur
  googleAnalyticsId: ""       // e.g. "G-XXXXXXXXXX" from Google Analytics. Leave "" to keep analytics off
};

/* =====================================================
   PRODUCTS — only used while CONFIG.sheetApiUrl is empty (old way).
   With the Google Sheet connected, your products come from the sheet instead.
   images: use a normal image link (https://.../photo.jpg), a file next
   to this HTML (e.g. "earrings.jpg"), or "embedded:name" for a photo
   stored inside this file (see EMBEDDED_IMAGES at the very bottom)
   ===================================================== */
const PRODUCTS = [
  {
    id: "001",
    name: "Earrings",
    price: 150,
    category: "jewellery",
    description: "Premium anti tarnish earrings",
    images: ["embedded:earrings"],
    stock: 2
  }
  // , { id:"002", name:"...", price:0, category:"jewellery", description:"...", images:["..."], stock:5 }
];

/* =====================================================
   DELIVERY_AREAS - chowks / roads with the LOWER delivery charge (CONFIG.nearAreaFee)
   Customers pick their nearest one at checkout. Add or remove lines freely.
   Any other Bhagalpur area gets CONFIG.otherBhagalpurFee.
   ===================================================== */
const DELIVERY_AREAS = [
  "Adampur Chowk",
  "Variety Chowk",
  "Tilkamanjhi Chowk",
  "Naya Bazar",
  "Gurhatta Chowk",
  "Ishakchak Chowk",
  "Khalifabagh Chowk",
  "SM College Road",
  "Surkhikal Road",
  "Kacheri Chowk",
  "Sarai Chowk",
  "Kotwali Chowk",
  "Station Chowk",
  "Tatarpur Chowk",
  "Manali Chowk"
];
</script>

<script>
/* SPEED: ask the Google Sheet for the shop list the moment the page starts, not after the whole page has been read.
   The shop code picks this answer up (see loadCatalog). Nothing else changes. */
window.__feed = null;
try {
  if (CONFIG.sheetApiUrl) {
    window.__feed = fetch(CONFIG.sheetApiUrl + (CONFIG.sheetApiUrl.indexOf("?") >= 0 ? "&" : "?") + "action=products&_=" + Date.now()).then(function (r) { return r.json(); });
    window.__feed.catch(function () {});
  }
} catch (e) { window.__feed = null; }
</script>

<style>
:root{
  --cream:#faf5ec; --sand:#f0e6d6; --clay:#a8532f; --clay-dark:#8f4627;
  --olive:#6b6b3a; --cocoa:#3b2a20; --muted:#7d6b5d; --line:#e2d5c1; --white:#fffdf9;
  --gold:#a67a35; --gold-dark:#845c22; --gold-soft:#dcc592;
  --radius:6px; --shadow:0 1px 3px rgba(59,42,32,.08); --shadow-lg:0 18px 40px rgba(59,42,32,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--cocoa);line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,.logo{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;line-height:1.15}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{max-width:100%;display:block}
.container{max-width:1150px;margin:0 auto;padding:0 20px}
main{flex:1;padding-bottom:50px}

/* Navbar */
nav{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:66px}
.logo{font-size:1.8rem;color:var(--clay-dark);letter-spacing:.5px}
.nav-links{display:flex;align-items:center;gap:22px;font-weight:500}
.nav-links a:hover{color:var(--clay)}
.cart-link{position:relative;display:flex;align-items:center;gap:6px}
.cart-link svg{width:24px;height:24px}
.badge{background:var(--clay);color:#fff;font-size:.72rem;font-weight:600;min-width:20px;height:20px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}

/* Hero */
.hero{background:linear-gradient(135deg,var(--sand),#e8d3b5);padding:70px 0;text-align:center;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);color:var(--clay-dark);margin-bottom:12px}
.hero p{font-size:1.15rem;color:var(--muted);max-width:520px;margin:0 auto 26px}

/* Buttons */
.btn{display:inline-block;background:var(--clay);color:#fff;border:none;border-radius:10px;padding:12px 24px;font-weight:600;font-size:.95rem;transition:background .2s,transform .2s,box-shadow .2s}
.btn:hover{background:var(--clay-dark);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:disabled{background:#c9bba9;cursor:not-allowed;transform:none;box-shadow:none}
.btn-outline{background:transparent;color:var(--clay-dark);border:1.5px solid var(--clay)}
.btn-outline:hover{background:var(--clay);color:#fff}
.btn-block{width:100%}
.btn.in-cart{background:var(--olive)}

/* Section */
.section-title{font-size:2rem;margin:42px 0 18px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.chip{background:var(--white);border:1.5px solid var(--line);border-radius:30px;padding:8px 18px;font-size:.9rem;font-weight:500;color:var(--muted);transition:all .2s;text-transform:capitalize}
.chip:hover{border-color:var(--clay);color:var(--clay)}
.chip.active{background:var(--clay);border-color:var(--clay);color:#fff}

/* Grid & cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px}
.card{background:var(--white);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .3s ease,box-shadow .3s ease;display:flex;flex-direction:column}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.card-img{aspect-ratio:3/4;overflow:hidden;background:var(--sand);position:relative}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.card:hover .card-img img{transform:scale(1.07)}
.tag{position:absolute;top:10px;left:10px;background:var(--cocoa);color:#fff;font-size:.72rem;padding:3px 10px;border-radius:20px}
.card-body{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--olive);font-weight:600}
.card h3{font-size:1.35rem;text-transform:capitalize}
.price{font-weight:600;color:var(--clay-dark);font-size:1.1rem}
.card .btn{margin-top:auto}
.card-btns{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.card-btns .btn{margin-top:0}
.btn-buy{background:var(--cocoa)}
.btn-buy:not(:disabled):hover{background:#000}
.buy-actions{display:flex;gap:12px;flex-wrap:wrap;width:100%;margin-top:4px}
.buy-actions .btn{flex:1 1 150px;text-align:center}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}

/* Product page */
.crumb{margin:26px 0 18px;color:var(--muted);font-size:.9rem}
.crumb a:hover{color:var(--clay)}
.product{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.gallery-main{aspect-ratio:3/4;background:var(--sand);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.gallery-main img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.thumbs img{width:70px;height:70px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer;opacity:.7;transition:all .2s;background:var(--sand)}
.thumbs img:hover,.thumbs img.active{opacity:1;border-color:var(--clay)}
.info h1{font-size:2.6rem;text-transform:capitalize;margin:6px 0 10px}
.info .price{font-size:1.7rem;margin-bottom:14px}
.info p.desc{color:var(--muted);margin-bottom:18px;font-size:1.02rem}
.stock{font-size:.9rem;margin-bottom:18px;font-weight:500}
.stock.ok{color:var(--olive)} .stock.low{color:var(--clay)} .stock.out{color:#a33}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--white)}
.qty button{width:38px;height:40px;background:transparent;border:none;font-size:1.2rem;color:var(--cocoa);transition:background .2s}
.qty button:hover{background:var(--sand)}
.qty span{min-width:40px;text-align:center;font-weight:600}
.buy-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}

/* Cart */
.cart-wrap{display:grid;grid-template-columns:1fr 330px;gap:30px;align-items:start}
.cart-item{display:grid;grid-template-columns:90px 1fr auto;gap:16px;align-items:center;background:var(--white);padding:14px;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px}
.cart-item img{width:90px;height:120px;object-fit:cover;border-radius:10px;background:var(--sand)}
.cart-item h3{font-size:1.25rem;text-transform:capitalize}
.cart-item .sub{color:var(--muted);font-size:.9rem}
.cart-actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.remove{background:none;border:none;color:#a33;font-size:.85rem;text-decoration:underline}
.summary{background:var(--white);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);position:sticky;top:90px}
.summary h3{font-size:1.5rem;margin-bottom:14px}
.row{display:flex;justify-content:space-between;margin-bottom:10px;gap:10px}
.row.total{border-top:1px solid var(--line);padding-top:12px;font-weight:600;font-size:1.15rem;color:var(--clay-dark)}
.summary .btn{margin-top:14px}

/* Checkout */
form label{display:block;font-weight:500;font-size:.9rem;margin:14px 0 6px}
form input,form textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--white);font-family:inherit;font-size:.95rem;color:var(--cocoa);transition:border-color .2s}
form input:focus,form textarea:focus,form select:focus{outline:none;border-color:var(--clay)}
form select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--white);font-family:inherit;font-size:.95rem;color:var(--cocoa)}
form textarea{resize:vertical;min-height:90px}
.form-card{background:var(--white);padding:24px;border-radius:var(--radius);box-shadow:var(--shadow)}
.error{color:#a33;margin-top:12px;font-size:.92rem}
.success{text-align:center;padding:70px 20px}
.success .tick{width:70px;height:70px;border-radius:50%;background:var(--olive);color:#fff;font-size:2.2rem;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.success h1{font-size:2.4rem;margin-bottom:8px}
.success .order-box{max-width:380px;margin:20px auto;background:var(--white);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);text-align:left}
.success .order-box h3{font-size:1.3rem;margin-bottom:10px}
.success .next{max-width:460px;margin:0 auto 18px;color:var(--muted)}
.success .redirect{margin-top:18px;font-size:.85rem;color:var(--muted)}
.success .redirect a{color:var(--clay);text-decoration:underline}
.btn-wa{background:#2e7d4f}
.btn-wa:hover{background:#245f3c}
.order-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.order-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.order-head strong{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.35rem}
.order-head span{color:var(--muted);font-size:.88rem}
.status{display:inline-block;background:var(--sand);color:var(--olive);font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:20px;margin-bottom:12px}
.order-card .btn{margin-top:10px;padding:10px 18px;font-size:.88rem}
.hint{color:var(--muted);font-size:.85rem;margin-bottom:18px}
.pay-box{max-width:380px;margin:0 auto 18px;background:var(--sand);border-radius:var(--radius);padding:16px 18px;text-align:center}
.order-card .pay-box{max-width:none;margin:12px 0 0}
.copy{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:2px 10px;font-size:.8rem;color:var(--clay-dark)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.toolbar input,.toolbar select{padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--white);font-family:inherit;font-size:.95rem;color:var(--cocoa)}
.toolbar input{flex:1;min-width:180px}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--clay)}
.wa-float{position:fixed;right:18px;bottom:18px;z-index:60;background:#2e7d4f;color:#fff;border-radius:30px;padding:12px 18px;display:none;align-items:center;gap:8px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow-lg);transition:transform .2s,background .2s}
.wa-float:hover{background:#245f3c;transform:translateY(-2px)}
.wa-float svg{width:22px;height:22px}
.policy{background:var(--white);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin-bottom:16px}
.policy h3{font-size:1.5rem;margin-bottom:8px}
.policy p{color:var(--muted)}
footer a{color:#f0e6d6;text-decoration:underline}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;width:max-content;max-width:calc(100vw - 32px);text-align:center;line-height:1.4;transform:translateX(-50%) translateY(80px);background:var(--cocoa);color:#fff;padding:12px 22px;border-radius:30px;opacity:0;transition:all .35s;z-index:100;font-size:.92rem;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

footer{background:var(--cocoa);color:#d9c9b5;text-align:center;padding:28px 20px;font-size:.9rem}
footer .logo{color:#f0e6d6;font-size:1.5rem;display:block;margin-bottom:4px}

@media(max-width:800px){
  .product,.cart-wrap{grid-template-columns:1fr}
  .summary{position:static}
  .info h1{font-size:2.1rem}
  .hero{padding:50px 0}
}
@media(max-width:480px){
  .grid{grid-template-columns:repeat(2,1fr);gap:14px}
  .card-body{padding:12px}
  .card h3{font-size:1.1rem}
  .cart-item{grid-template-columns:70px 1fr}
  .cart-item img{width:70px;height:93px}
  .cart-actions{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  .logo{font-size:1.5rem}
  .nav-links{gap:14px}
}
/* colour choices */
.colours{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.colour{background:var(--white);border:1.5px solid var(--line);border-radius:30px;padding:7px 16px;font-size:.9rem;font-weight:500;color:var(--cocoa);transition:all .2s}
.colour:hover{border-color:var(--clay)}
.colour.active{background:var(--clay);border-color:var(--clay);color:#fff}
.colour.gone{opacity:.5;text-decoration:line-through}
.colour-label{font-size:.85rem;color:var(--muted);margin-bottom:8px}
.more-colours{font-size:.8rem;color:var(--muted)}
.notice{background:var(--sand);border-radius:10px;padding:12px 16px;margin:14px 0;font-size:.92rem;color:var(--cocoa)}
.loading{text-align:center;padding:80px 20px;color:var(--muted)}
/* Home: trust strip + category tiles */
.hero .hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:-26px;position:relative;z-index:2}
.trust div{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.86rem;color:var(--muted);box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start}
.trust b{color:var(--clay-dark);display:block;font-size:.92rem}
.trust i{font-style:normal;font-size:1.25rem;line-height:1}
.cat-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.cat-tile{position:relative;border:none;padding:0;border-radius:var(--radius);overflow:hidden;aspect-ratio:4/5;background:var(--sand);box-shadow:var(--shadow);text-align:left;transition:transform .25s,box-shadow .25s}
.cat-tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.cat-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.cat-tile:hover img{transform:scale(1.06)}
.cat-tile::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(40,26,18,.78),rgba(40,26,18,0) 55%)}
.cat-tile .cat-name{position:absolute;left:14px;right:14px;bottom:30px;z-index:1;color:#fff;font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:1.45rem;line-height:1.1}
.cat-tile .cat-count{position:absolute;left:14px;bottom:12px;z-index:1;color:#f0e6d6;font-size:.78rem;letter-spacing:.4px}

/* Payment choice + pay box */
.pay-options{display:grid;gap:10px;margin:6px 0 4px}
.pay-opt{display:flex!important;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--white);cursor:pointer;font-weight:400!important;margin:0!important}
.pay-opt:has(input:checked){border-color:var(--clay);background:#fff8f1}
.pay-opt.off{opacity:.55;cursor:not-allowed}
.pay-opt input{width:auto!important;margin-top:5px;flex:none}
.pay-opt b{display:block;font-weight:600}
.pay-opt small{display:block;color:var(--muted);font-size:.82rem}
.pay-big{display:block;text-align:center;font-size:1.05rem;padding:15px 22px}
.pay-apps{display:grid;grid-template-columns:1fr;gap:9px}
.pay-box .pay-app{display:flex;align-items:center;gap:14px;background:var(--white);color:var(--cocoa);border:1.5px solid var(--line);padding:9px 14px;font-size:1.02rem;text-align:left}
.pay-box .pay-app:hover{background:#fff;border-color:var(--clay);box-shadow:var(--shadow)}
.pay-app .pay-logo{flex:0 0 86px;height:36px;display:flex;align-items:center;justify-content:center}

/* Moving offer banner. Only "transform" is animated, so it runs on the graphics chip and never re-lays out the page. */
.announce{flex:none;position:relative;overflow:hidden;background:var(--cocoa);color:#e9dfcd;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;line-height:1.5;padding:9px 0;min-height:calc(1.5em + 18px);contain:layout paint style}
.announce::before,.announce::after{content:"";position:absolute;top:0;bottom:0;width:34px;z-index:1;pointer-events:none}
.announce::before{left:0;background:linear-gradient(90deg,var(--cocoa),rgba(59,42,32,0))}
.announce::after{right:0;background:linear-gradient(270deg,var(--cocoa),rgba(59,42,32,0))}
.announce.ann-tap{cursor:pointer}
.ann-track{display:flex;width:max-content;will-change:transform;backface-visibility:hidden;animation:ann-scroll var(--ann-dur,30s) linear infinite}
.ann-item{flex:none;position:relative;white-space:nowrap;padding:0 56px 0 0}
.ann-item::after{content:"";position:absolute;right:25px;top:50%;width:5px;height:5px;margin-top:-2.5px;background:var(--gold-soft);opacity:.85;transform:rotate(45deg)}
@keyframes ann-scroll{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
.announce.ann-hold .ann-track,.announce.ann-off .ann-track{animation-play-state:paused}
@media (hover:hover){.announce:hover .ann-track{animation-play-state:paused}}
@media (prefers-reduced-motion:reduce){
  .announce{text-align:center;padding:9px 16px}
  .announce::before,.announce::after{display:none}
  .ann-track{animation:none;width:auto;display:block}
  .ann-item{white-space:normal;padding:0}
  .ann-item::after,.ann-item[aria-hidden="true"]{display:none}
}

.card-img img.alt{position:absolute;inset:0;opacity:0;transition:opacity .5s ease}
@media(hover:hover){.card:hover .card-img img.alt{opacity:1}}
.card .btn-buy{border:0;background:transparent;text-decoration:underline;text-underline-offset:4px;letter-spacing:.14em;color:var(--muted);padding:8px 0 0}
.card .btn-buy:not(:disabled):hover{background:transparent;color:var(--cocoa)}
.card-body{padding-top:18px}
footer{text-align:left;padding:64px 20px 28px;border-top:3px double var(--gold)}
.foot-grid{display:grid;grid-template-columns:1.4fr .9fr 1.35fr 1.3fr;gap:30px;padding:0}
.foot-brand .logo{text-align:left;display:block;margin-bottom:10px}
.foot-brand p{color:#b9ad9b;max-width:320px;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:1.2rem}
footer h4{font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-soft);font-weight:600;margin-bottom:14px;font-family:'Inter',sans-serif}
footer .foot-grid a{display:block;text-decoration:none;color:#d9cdb9;margin-bottom:9px;font-size:.88rem}
footer .foot-grid a:hover{color:#fff}
.foot-pay{display:flex;flex-wrap:wrap;gap:8px}
.foot-pay img{height:26px;width:auto;background:#fff;border-radius:3px;padding:4px 8px}
.foot-note{color:#a89c8a;font-size:.78rem;margin-top:10px}
.foot-base{max-width:1150px;margin:44px auto 0;padding:20px 20px 0;border-top:1px solid rgba(255,255,255,.12);text-align:center;font-size:.76rem;letter-spacing:.06em;color:#a89c8a}
.foot-base a{color:#a89c8a}
@media(max-width:800px){
  .hero-grid{grid-template-columns:1fr}
  .hero-pic{order:-1;min-height:0;aspect-ratio:4/5;max-height:480px;width:100%}
  .hero-copy{align-items:center;text-align:center;padding:44px 22px 54px}
  .hero h1,.hero p{text-align:center}
  .hero .hero-btns{justify-content:center}
  .hero p{margin-left:auto;margin-right:auto}
  .foot-grid{grid-template-columns:1fr 1fr;gap:30px}
  .foot-brand{grid-column:1/-1}
  .foot-brand .logo,.foot-brand p{text-align:center;margin-left:auto;margin-right:auto}
  .section-title{margin:60px 0 28px}
}
@media(max-width:480px){
  .nav-inner{grid-template-columns:auto 1fr auto;gap:8px}
  .nav-left{gap:11px;font-size:.62rem;letter-spacing:.1em;order:0}
  .logo{font-size:.78rem;letter-spacing:.1em}
  .nav-links{order:2}
  .container.nav-inner{padding:0 14px}
}

/* ===== Logo (M | G monogram) ===== */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* shop loading skeleton */
.skel-wrap{padding-top:34px;padding-bottom:40px;min-height:70vh}
.skel-title{width:min(260px,60%);height:26px;margin:0 auto 28px;border-radius:3px}
.skel-pic{aspect-ratio:4/5;border-radius:4px}
.skel-line{height:12px;margin:14px auto 0;width:70%;border-radius:3px}
.skel-line.short{width:38%}
.skel-title,.skel-pic,.skel-line{background:var(--sand);animation:skel 1.4s ease-in-out infinite}
@keyframes skel{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.skel-title,.skel-pic,.skel-line{animation:none}}
.brand{display:flex;align-items:center;justify-content:center;gap:14px;color:var(--cocoa)}
.mark{height:30px;width:auto;aspect-ratio:459.6/208.8;flex:0 0 auto;display:block;--lg-ink:var(--cocoa);--lg-gold:var(--gold)}
.brand .logo{font-family:'Jost','Inter',sans-serif;font-weight:500;font-size:.8rem;letter-spacing:.36em;text-transform:uppercase;color:var(--gold-dark);line-height:1;white-space:nowrap}
.foot-logo{display:block;width:200px;height:auto;aspect-ratio:454.5/279.5;margin:0 0 18px;--lg-ink:#f2e8d5;--lg-gold:#d9b873;--lg-sub:#d9b873}
@media(max-width:800px){.foot-logo{margin-left:auto;margin-right:auto}}
@media(max-width:480px){
  .brand{order:1;gap:9px}
  .mark{height:22px}
  .brand .logo{font-size:.68rem;letter-spacing:.26em}
}
@media(max-width:360px){
  .brand{gap:6px}
  .mark{height:18px}
  .brand .logo{font-size:.56rem;letter-spacing:.18em}
}

/* ===== Hero logo panel ===== */
.hero-logo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%,#53382a 0%,#3b2a20 58%,#2a1d15 100%);
  --lg-ink:#f2e8d5;--lg-gold:#d9b873;--lg-sub:#d9b873}
.hero-logo::after{content:"";position:absolute;inset:18px;border:1px solid rgba(217,184,115,.32);pointer-events:none}
.hl-lockup{position:relative;width:min(68%,400px);height:auto;aspect-ratio:454.5/279.5}
@media(max-width:800px){.hl-lockup{width:min(72%,330px)}}

/* ===== Back link (cart, checkout, payment, orders) ===== */
.back-link{display:inline-flex;align-items:center;gap:10px;margin:22px 0 0;padding:12px 0;min-height:44px;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--muted);text-decoration:none;transition:color .2s}
.back-link svg{width:17px;height:17px;flex:0 0 auto;transition:transform .2s}
.back-link:hover{color:var(--cocoa)}
.back-link:hover svg{transform:translateX(-3px)}
.back-link:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:2px}
.back-link + .section-title{margin-top:6px}
.success .back-link{display:flex;width:fit-content;margin:-44px auto 26px 0}
@media(max-width:480px){.success .back-link{margin-top:-52px}}

/* ---- v2: offer, live status, reviews, FAQ ---- */
[hidden]{display:none!important}
.linkbtn{background:none;border:0;padding:0;color:var(--clay-dark);text-decoration:underline;text-underline-offset:3px;font-size:inherit;font-weight:600;font-family:inherit;cursor:pointer}
.container.narrow{max-width:760px}
.offer-pill{display:inline-flex;flex-direction:column;align-items:flex-start;gap:3px;background:transparent;border:1px solid var(--gold);padding:11px 18px;margin:0 0 28px;text-align:left;cursor:pointer;border-radius:2px;font-family:inherit;max-width:100%}
.offer-pill .op-main{font-size:.82rem;font-weight:600;letter-spacing:.03em;color:var(--cocoa)}
.offer-pill .op-sub{font-size:.68rem;color:var(--gold-dark);letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.offer-pill .op-tap{font-size:.68rem;color:var(--muted)}
.offer-pill:hover{background:rgba(166,122,53,.09)}
@media(max-width:800px){.offer-pill{align-items:center;text-align:center;margin-bottom:24px}}
.offer-box{margin-top:6px}
.code-row{display:flex;gap:8px;align-items:stretch}
.code-row input{flex:1;min-width:0;text-transform:uppercase;letter-spacing:.08em}
.code-row .btn{padding:10px 18px;white-space:nowrap;margin:0}
.row.disc{color:var(--olive)}
.offer-hint{color:var(--gold-dark)!important;font-weight:500}
.nudge{margin:0 0 16px}.nudge p{font-size:.88rem;margin-bottom:7px}
.nudge-bar{height:6px;background:var(--sand);border-radius:3px;overflow:hidden}
.nudge-bar i{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .4s}
.nudge.done p{color:var(--olive);margin:0}
.ig-ico{width:15px;height:15px;vertical-align:-2px;margin-right:7px}
.status.bad{background:#f6dcd6;color:#8a2b1c}
.status.good{background:#e1ead2;color:#3f5a1d}
.steps{display:flex;list-style:none;margin:2px 0 14px;padding:0}
.steps li{flex:1;text-align:center;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);position:relative;padding-top:22px;line-height:1.3}
.steps li::before{content:"";position:absolute;top:3px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--line);z-index:1}
.steps li::after{content:"";position:absolute;top:8px;left:-50%;width:100%;height:2px;background:var(--line)}
.steps li:first-child::after{display:none}
.steps li.done::before,.steps li.done::after{background:var(--gold)}
.steps li.done{color:var(--cocoa)}
.steps li.now::before{box-shadow:0 0 0 4px rgba(166,122,53,.25)}
.steps li.now{font-weight:700}
.pay-done{margin:12px 0 0;padding:10px 14px;background:var(--sand);color:var(--olive);font-weight:600;font-size:.9rem;border-radius:var(--radius)}
.vp{margin:0 0 12px}
.stars{color:var(--gold);letter-spacing:.06em;font-size:1rem;white-space:nowrap}
.stars i{font-style:normal;color:var(--line)}
.rv-sum{text-align:center;margin:-10px 0 24px;color:var(--muted)}
.rv-sum .stars{font-size:1.2rem;margin-right:6px}
.rv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,400px));justify-content:center;gap:16px}
.rv-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:0}
.rv-card blockquote{margin:10px 0 14px;white-space:pre-line;color:var(--cocoa);font-family:'Cormorant Garamond',Georgia,serif;font-size:1.18rem;line-height:1.4;overflow-wrap:anywhere}
.rv-card figcaption{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:2px;margin-top:10px}
.rv-card figcaption b{color:var(--cocoa);font-size:.86rem}
.rv-page{max-width:540px}
.star-pick{display:flex;gap:0;margin:4px 0 8px}
.star-pick button{background:none;border:0;font-size:2.4rem;line-height:1;color:var(--line);min-width:48px;min-height:48px;padding:0}
.star-pick button.on{color:var(--gold)}
.faq-group{font-size:1.65rem;margin:34px 0 12px;color:var(--gold-dark)}
.faq{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px}
.faq summary{cursor:pointer;padding:15px 18px;font-weight:600;font-size:.95rem;list-style:none;display:flex;justify-content:space-between;gap:14px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:1.4rem;color:var(--gold);line-height:1;flex:none}
.faq[open] summary::after{content:"\2013"}
.faq-a{padding:0 18px 16px;color:var(--muted);font-size:.93rem;overflow-wrap:anywhere}
.help-links{text-align:center;margin:30px 0 10px;font-size:.88rem;color:var(--muted)}
.help-links a{color:var(--clay-dark);text-decoration:underline;text-underline-offset:3px}
.policy p+p{margin-top:8px}
.notify-wrap{margin:-4px 0 18px}
.notify-wrap p{font-size:.84rem;color:var(--muted);margin-top:8px}
.order-card .btn{white-space:normal;text-align:center;max-width:100%}
.adm-offer{background:var(--sand);border:1px solid var(--line);padding:11px 14px;border-radius:var(--radius);font-size:.86rem;margin:0 0 12px;line-height:1.5}
.adm-offer.off{background:#f6dcd6;border-color:#e6b9ae}
/* ---------- Phones: the products come up much sooner (hero, trust strip and category pictures are made compact) ---------- */
@media(max-width:640px){
  .hero-pic{display:none}                                   /* the logo is already in the top bar */
  .hero-copy{padding:26px 20px 24px}
  .hero h1{font-size:2.15rem;line-height:1.05}
  .hero .rule{margin:14px auto}
  .hero p{font-size:1.2rem;margin:0 auto 16px}
  .offer-pill{margin-bottom:16px;padding:9px 14px}
  .hero .hero-btns{gap:8px;flex-wrap:nowrap}
  .hero .hero-btns .btn{padding:12px 14px;font-size:.72rem;letter-spacing:.1em;flex:1 1 0;white-space:normal;text-align:center;display:flex;align-items:center;justify-content:center}
  .trust{display:flex;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding:0 14px;gap:0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .trust::-webkit-scrollbar,.cat-tiles::-webkit-scrollbar,#shop .filters::-webkit-scrollbar{display:none}
  .trust div{flex:0 0 82%;scroll-snap-align:start;flex-direction:row;align-items:center;text-align:left;gap:12px;padding:12px 6px}
  .trust span{text-align:left;font-size:.78rem;line-height:1.35}
  .trust b{margin-bottom:1px}
  .trust svg{flex:none;width:22px;height:22px}
  .home-block .section-title{margin:20px 0 12px;font-size:1.45rem}
  .home-block .section-title::after{margin-top:8px}
  .cat-tiles{display:flex;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding:0 20px;gap:10px;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .cat-tile{flex:0 0 112px;scroll-snap-align:start}
  .cat-tile .cat-name{font-size:1.05rem;bottom:26px;left:4px;right:4px}
  .cat-tile .cat-count{font-size:.54rem;bottom:10px}
  #shop .toolbar{flex-wrap:nowrap;gap:8px;margin-bottom:10px}
  #shop .toolbar input{min-width:0;padding:10px 12px}
  #shop .toolbar select{max-width:44%;padding:10px 8px}
  #shop .filters{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;gap:8px;margin:0 -20px 16px;padding:0 20px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #shop .filters .chip{flex:none;padding:8px 14px}
}

/* ===== v3: new header, slider, wishlist ===== */
.nav-inner{grid-template-columns:auto minmax(0,1fr) auto;gap:20px}
.nav-inner .brand{order:0;justify-content:flex-start}
.nav-inner .nav-left{order:0;min-width:0;display:flex;gap:clamp(16px,2.2vw,32px);align-items:center;overflow-x:auto;scrollbar-width:none;font-size:.72rem;letter-spacing:.12em;white-space:nowrap}
.nav-inner .nav-left::-webkit-scrollbar{display:none}
.nav-left a{padding:8px 0;position:relative;font-weight:600;flex:none}
.nav-left a:first-child{margin-left:auto}
.nav-left a:last-child{margin-right:auto}
.nav-left a:hover::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:2px;background:var(--gold)}
.nav-inner .nav-links{order:0;gap:6px}
.icon-link{position:relative;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:transparent;color:var(--cocoa);padding:0}
.icon-link svg{width:25px;height:25px}
.icon-link:hover{color:var(--gold)}
.icon-link .badge{position:absolute;top:3px;right:1px;pointer-events:none}
.wish-link .badge{background:var(--clay)}
.nav-strip{display:none}
.on-admin .nav-strip{display:none!important}
#shop{scroll-margin-top:84px}
@media(max-width:900px){
  .nav-inner .nav-left{display:none}
  .nav-strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:9px 14px;background:var(--white);border-bottom:1px solid var(--line);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;white-space:nowrap}
  .nav-strip::-webkit-scrollbar{display:none}
  .nav-strip a{flex:none;padding:8px 14px;border:1px solid var(--line);border-radius:30px;background:var(--cream)}
  .nav-strip a:hover{border-color:var(--gold);color:var(--gold-dark)}
}
@media(max-width:480px){
  .nav-inner{grid-template-columns:minmax(0,1fr) auto;gap:6px}
  .nav-inner .brand{order:0}
  .nav-inner .nav-links{order:0;gap:0}
  .icon-link{width:42px;height:44px}
  .icon-link svg{width:24px;height:24px}
  .container.nav-inner{padding:0 8px 0 14px}
}
/* hearts */
.wish{position:absolute;top:8px;right:8px;z-index:3;width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,253,249,.94);color:var(--cocoa);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 1px 4px rgba(59,42,32,.18);-webkit-tap-highlight-color:transparent}
.wish svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;transition:transform .2s}
.wish:hover{color:var(--clay)}
.wish.on{color:var(--clay)}
.wish.on svg{fill:currentColor}
.wish:active svg{transform:scale(.85)}
.gal-col{position:relative}
.gal-col .wish{top:12px;right:12px;width:44px;height:44px}
.wish-empty{text-align:center;padding:70px 0 40px}
.wish-empty h2{font-size:2.2rem}
.wish-empty p{margin:10px 0 22px;color:var(--muted)}
/* slider */
.slider{position:relative;background:var(--cocoa);overflow:hidden}
.sl-track{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.sl-track::-webkit-scrollbar{display:none}
.sl-slide{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;display:flex;height:540px;background:var(--sl-bg,#3b2a20);color:var(--sl-fg,#fffdf9);-webkit-tap-highlight-color:transparent;-webkit-user-drag:none}
.sl-text{flex:0 0 46%;min-width:0;box-sizing:border-box;padding:0 40px 0 max(32px,calc((100% - 1150px)/2 + 20px));display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.sl-eyebrow{font-size:.74rem;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--sl-eb,#dcc592)}
.sl-text h2{margin:16px 0 0;font-family:var(--hf,"Cormorant Garamond",Georgia,serif);font-weight:var(--hw,600);font-size:calc(clamp(2.6rem,5.6vw,5.4rem)*var(--hm,1));line-height:var(--hl,.98);color:inherit;overflow-wrap:break-word;max-width:100%}
.sl-rule{display:block;width:64px;height:2px;background:var(--sl-rule,#a67a35);margin:26px 0}
.sl-text p{margin:0 0 30px;font-size:1.1rem;max-width:400px;color:inherit;opacity:.92}
.sl-code{display:inline-block;border:1.5px dashed currentColor;padding:8px 18px;margin:-8px 0 26px;font-weight:700;letter-spacing:.16em;font-size:1.05rem}
.sl-cta{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 30px;font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;transition:filter .2s;background:var(--sl-btn,#fffdf9);color:var(--sl-btnfg,#3b2a20)}
.sl-slide:hover .sl-cta{filter:brightness(.93)}
.sl-media{flex:1;min-width:0;display:flex;gap:10px}
.sl-media img{flex:1 1 0;width:0;min-width:0;height:100%;object-fit:cover;background:var(--sand)}
.sl-media.empty{align-items:center;justify-content:center;background:rgba(127,127,127,.12);background:color-mix(in srgb,var(--sl-fg,#fff) 9%,transparent)}
.sl-mono{width:46%;max-width:300px;height:auto;--lg-ink:var(--sl-fg,#f2e8d5);--lg-gold:var(--sl-eb,#d9b873);opacity:.9}
/* Admin: Banners tab */
.adm-tabs{overflow-x:auto;scrollbar-width:none}
.adm-tabs::-webkit-scrollbar{display:none}
.adm-tabs button{flex:1 0 auto;padding:12px 14px;white-space:nowrap}
@media(max-width:480px){.adm-tabs{gap:6px}.adm-tabs button{padding:12px 9px;font-size:.84rem}}
.adm-sl{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px 12px;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.adm-sl.is-off{opacity:.8}
.adm-sl .adm-thumb{width:72px;height:90px}
.adm-sl-info b{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:1.35rem;line-height:1.15;overflow-wrap:anywhere}
.adm-sl-acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.adm-sl-acts .adm-btn:disabled{opacity:.45}
.adm-chip{display:inline-block;margin-top:7px;font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:20px;background:#eee;color:#555}
.adm-chip.c-on{background:#dff1e3;color:#1f6b3a}
.adm-chip.c-wait{background:#fdf0d5;color:#8a5a00}
.adm-sl-offer{background:#fdf6e6;border:1px solid #ecd9a8;border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:.88rem}
.adm-form select,.adm-form input[type=date]{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:.95rem;background:var(--white);color:var(--cocoa);min-height:46px}
.adm-two>div{min-width:0}
.adm-form input[type=date]{min-width:0;max-width:100%}
.adm-slp{display:flex;border-radius:10px;overflow:hidden;min-height:150px;margin:6px 0 4px;background:var(--sl-bg,#3b2a20);color:var(--sl-fg,#fffdf9)}
.adm-slp-t{flex:1 1 55%;min-width:0;padding:14px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px}
.adm-slp .sl-eyebrow{font-size:.58rem;letter-spacing:.22em}
.adm-slp-h{font-family:var(--hf,'Cormorant Garamond',Georgia,serif);font-size:calc(1.55rem*var(--hm,1));line-height:var(--hl,1);font-weight:var(--hw,600);overflow-wrap:anywhere}
.adm-slp-m{font-size:.76rem;opacity:.92;overflow-wrap:anywhere}
.adm-slp .sl-cta{min-height:32px;padding:0 14px;font-size:.6rem;margin-top:4px}
.adm-slp-p{flex:1 1 45%;min-width:0;display:flex;gap:3px;background:rgba(255,255,255,.07)}
.adm-slp-p img{flex:1 1 0;width:0;min-width:0;height:100%;object-fit:cover}

.adm-slp-none{margin:auto;font-size:.7rem;opacity:.75;padding:8px;text-align:center}
.adm-sw{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.adm-form label.adm-swatch{position:relative;display:block;margin:0;cursor:pointer;min-width:0}
.adm-swatch input[type=radio]{position:absolute;opacity:0;pointer-events:none}
.adm-swatch .sw{display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:48px;padding:4px 6px;border-radius:10px;border:2px solid var(--line);font-size:.76rem;font-weight:600;line-height:1.15;background:var(--sl-bg,#3b2a20);color:var(--sl-fg,#fffdf9);overflow-wrap:anywhere}
.adm-swatch .sw-custom{background:var(--sl-bg,#f0e6d6)}
.adm-swatch input[type=color]{flex:none;width:30px;height:30px;padding:0;border:2px solid currentColor;border-radius:50%;background:none;cursor:pointer;overflow:hidden}
.adm-swatch input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.adm-swatch input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.adm-swatch input[type=color]::-moz-color-swatch{border:0;border-radius:50%}
.adm-swatch input:checked+.sw{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.adm-swatch input:focus-visible+.sw{outline:2px solid var(--cocoa);outline-offset:3px}
.adm-fonts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.adm-form label.adm-fontopt{position:relative;display:block;margin:0;cursor:pointer;min-width:0}
.adm-fontopt input{position:absolute;opacity:0;pointer-events:none}
.adm-fontopt .fo{display:flex;flex-direction:column;justify-content:center;min-height:70px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--white)}
.adm-fontopt .fo b{font-family:var(--hf);font-weight:var(--hw,600);font-size:calc(1.4rem*var(--hm,1));line-height:var(--hl,1.1);color:var(--cocoa);overflow-wrap:anywhere}
.adm-fontopt .fo small{font-size:.72rem;font-weight:600;color:var(--muted);margin-top:2px}
.adm-fontopt input:checked+.fo{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.adm-fontopt input:focus-visible+.fo{outline:2px solid var(--cocoa);outline-offset:3px}
/* slide colours: each one only sets the colour variables the slide, the small preview and the swatches use */
.sl-dark{--sl-bg:#3b2a20;--sl-fg:#fffdf9;--sl-eb:#dcc592;--sl-rule:#a67a35;--sl-btn:#fffdf9;--sl-btnfg:#3b2a20}
.sl-cream{--sl-bg:#f0e6d6;--sl-fg:#3b2a20;--sl-eb:#845c22;--sl-rule:#a67a35;--sl-btn:#a8532f;--sl-btnfg:#fff}
.sl-clay{--sl-bg:#a8532f;--sl-fg:#fff;--sl-eb:#fff;--sl-rule:#fff;--sl-btn:#fffdf9;--sl-btnfg:#3b2a20}
.sl-wine{--sl-bg:#5c1f2e;--sl-fg:#fff7f0;--sl-eb:#e8c98a;--sl-rule:#e8c98a;--sl-btn:#fff7f0;--sl-btnfg:#5c1f2e}
.sl-forest{--sl-bg:#25402f;--sl-fg:#fbf6ea;--sl-eb:#dcc592;--sl-rule:#dcc592;--sl-btn:#fbf6ea;--sl-btnfg:#25402f}
.sl-navy{--sl-bg:#1e2d4a;--sl-fg:#fbf6ea;--sl-eb:#dcc592;--sl-rule:#dcc592;--sl-btn:#fbf6ea;--sl-btnfg:#1e2d4a}
.sl-black{--sl-bg:#171210;--sl-fg:#fffdf9;--sl-eb:#dcc592;--sl-rule:#a67a35;--sl-btn:#dcc592;--sl-btnfg:#171210}
.sl-gold{--sl-bg:#c99a4b;--sl-fg:#2e1f16;--sl-eb:#2e1f16;--sl-rule:#2e1f16;--sl-btn:#2e1f16;--sl-btnfg:#fffdf9}
.sl-blush{--sl-bg:#f3d8d2;--sl-fg:#4d2228;--sl-eb:#8a3f48;--sl-rule:#8a3f48;--sl-btn:#5c1f2e;--sl-btnfg:#fff}
.sl-sage{--sl-bg:#dde5d3;--sl-fg:#24392c;--sl-eb:#4d6b4f;--sl-rule:#4d6b4f;--sl-btn:#25402f;--sl-btnfg:#fff}
.sl-white{--sl-bg:#fffdf9;--sl-fg:#3b2a20;--sl-eb:#845c22;--sl-rule:#a67a35;--sl-btn:#3b2a20;--sl-btnfg:#fffdf9}
/* heading fonts: each sets the font and a size/line-height adjustment so every font fits the same space */
.slf-elegant{--hf:"Cormorant Garamond",Georgia,serif;--hw:600;--hm:1;--hl:.98}
.slf-classic{--hf:"Playfair Display",Georgia,serif;--hw:600;--hm:.82;--hl:1.05}
.slf-modern{--hf:"Jost","Inter",system-ui,sans-serif;--hw:500;--hm:.82;--hl:1.05}
.slf-clean{--hf:"Inter",system-ui,sans-serif;--hw:600;--hm:.78;--hl:1.08}
.slf-script{--hf:"Dancing Script","Brush Script MT",cursive;--hw:700;--hm:1;--hl:1.1}
.slf-caps{--hf:"Cinzel",Georgia,serif;--hw:600;--hm:.7;--hl:1.1}
.slf-hindi{--hf:"Noto Serif Devanagari","Mukta",Georgia,serif;--hw:600;--hm:.78;--hl:1.25}
.sl-arrow{position:absolute;top:50%;margin-top:-26px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--white);border:0;color:var(--cocoa);z-index:2}
.sl-arrow:hover{background:var(--sand)}
.sl-arrow svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sl-prev{left:0}.sl-next{right:0}
.sl-bar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;background:rgba(59,42,32,.66);padding:2px 8px;border-radius:22px;z-index:2}
.sl-bar button{border:0;background:transparent;width:24px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;color:#fff}
.sl-dot::before{content:"";display:block;height:9px;width:9px;border-radius:5px;background:rgba(255,255,255,.55);transition:width .3s,background .3s}
.sl-dot.on::before{width:26px;background:#fff}
.sl-dot.on{width:40px}
.sl-pp{margin-left:4px;border-left:1px solid rgba(255,255,255,.3)!important;width:30px!important}
.sl-pp svg{width:14px;height:14px;fill:currentColor}
.sl-pp .i-play{display:none}.sl-pp.paused .i-play{display:block}.sl-pp.paused .i-pause{display:none}
.slider :focus-visible{outline:2px solid var(--gold-soft);outline-offset:-4px}
@media(hover:none),(max-width:900px){.sl-arrow{display:none}}
@media(max-width:900px){
  .sl-slide{flex-direction:column;height:auto}
  .sl-media{order:-1;flex:none;height:230px;gap:4px}
  .sl-text{flex:none;padding:20px 22px 62px}
  .sl-text h2{font-size:calc(clamp(1.95rem,8.6vw,2.7rem)*var(--hm,1));margin-top:8px}
  .sl-rule{margin:14px 0}
  .sl-text p{font-size:1rem;margin-bottom:18px}
  .sl-code{margin:-6px 0 16px;padding:6px 14px;font-size:.95rem}
  .slider.one .sl-text{padding-bottom:30px}
}
@media(prefers-reduced-motion:reduce){.sl-dot::before{transition:none}}
</style>

<script>
/* ---------- Helpers ---------- */
const $ = (s) => document.querySelector(s);
const app = $("#app");
const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="#f0e6d6"/><text x="200" y="210" font-family="Georgia" font-size="28" fill="#b5603a" text-anchor="middle">' + CONFIG.storeName + '</text></svg>');
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n) => CONFIG.currency + Number(n).toLocaleString("en-IN");
/* ---------- Catalogue: designs (products) with colour variants ----------
   product = { id: code, name, category, description, images[], variants: [{ sku, colour, price, stock, photo }], price (lowest), stock (total) }
   The cart stores the variant's sku. */
let CATALOG = [];
const SHEET_MODE = !!CONFIG.sheetApiUrl;
const CATALOG_CACHE_KEY = CONFIG.cartKey + " catalog";
function finishProduct(p) {
  p.stock = p.variants.reduce((s, v) => s + v.stock, 0);
  p.price = Math.min(...p.variants.map(v => v.price));
  p.priceVaries = p.variants.some(v => v.price !== p.price);
  const photos = [];
  p.variants.forEach(v => { if (v.photo && !photos.includes(v.photo)) photos.push(v.photo); });
  (p.extraImages || []).forEach(im => { if (!photos.includes(im)) photos.push(im); });
  p.images = photos.length ? photos : [""];
  return p;
}
function staticCatalog() {            // old way: PRODUCTS array above
  return PRODUCTS.map(p => finishProduct({
    id: p.id, name: p.name, category: p.category, description: p.description || "", extraImages: p.images.slice(1),
    variants: [{ sku: p.id, colour: "", price: p.price, stock: p.stock, photo: p.images[0] || "" }]
  }));
}
function buildCatalog(rows) {         // sheet way: one row per colour, same code = same design
  const byCode = new Map();
  rows.forEach(r => {
    if (!byCode.has(r.code)) byCode.set(r.code, { id: r.code, name: r.name, category: r.category || "Others", description: r.description || "", variants: [] });
    const p = byCode.get(r.code);
    if (!p.description && r.description) p.description = r.description;
    const pics = String(r.photo || "").split("|").map(x => x.trim()).filter(Boolean);     // several photos in one cell: first = main, the rest = gallery
    p.extraImages = (p.extraImages || []).concat(pics.slice(1));
    p.variants.push({ sku: r.sku, colour: r.colour || "", price: Number(r.price), stock: Math.max(0, Number(r.stock) || 0), photo: pics[0] || "" });
  });
  return [...byCode.values()].map(finishProduct);
}
const findProduct = (id) => CATALOG.find(p => p.id === id);
function findVariant(sku) {
  for (const p of CATALOG) { const v = p.variants.find(x => x.sku === sku); if (v) return { product: p, variant: v }; }
  return null;
}
const variantName = (p, v) => p.name + (v.colour ? " – " + v.colour : "");
const firstAvailable = (p) => p.variants.find(v => v.stock > 0) || p.variants[0];
const resolveSrc = (src) => {
  if (src && src.startsWith("embedded:")) return (typeof EMBEDDED_IMAGES !== "undefined" && EMBEDDED_IMAGES[src.slice(9)]) || "";
  return src;
};
/* Photos saved by the Admin page live on Google Drive as ...thumbnail?id=..&sz=w1000. Google makes smaller copies on request, so lists use a small one and only the product page loads the big one. */
const sized = (src, w) => typeof src === "string" ? src.replace(/(drive\.google\.com\/thumbnail\?[^"'\s]*?sz=w)\d+/, "$1" + w) : src;
const imgTag = (src, alt, extra = "") =>
  `<img src="${esc(resolveSrc(src) || PLACEHOLDER)}" alt="${esc(alt)}" referrerpolicy="no-referrer" ${extra} onerror="this.onerror=null;this.src='${PLACEHOLDER}'">`;

let activeCategory = "all";
let successTimer;
let searchTerm = "", sortMode = "featured";

/* ---------- Cart (localStorage) ---------- */
function getCart() {
  try {
    const c = JSON.parse(localStorage.getItem(CONFIG.cartKey));
    return Array.isArray(c) ? c : [];
  } catch { return []; }
}
function saveCart(cart) {
  try { localStorage.setItem(CONFIG.cartKey, JSON.stringify(cart)); } catch {}
  updateBadge();
}
function inCart(sku) { return getCart().some(i => i.id === sku); }
const cartQty = (sku) => { const i = getCart().find(x => x.id === sku); return i ? i.qty : 0; };
const TRASH_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"/></svg>';
/** On a product card: the quantity in the cart, with - and + right there (the - is a bin when only one is left). */
function stepperHTML(v, q) {
  const atMax = q >= v.stock;
  return `<div class="stepper" data-stepper role="group" aria-label="Quantity in your cart">
    <button type="button" data-cardq="-1" data-sku="${esc(v.sku)}" aria-label="${q === 1 ? "Remove from cart" : "One less"}">${q === 1 ? TRASH_SVG : "−"}</button>
    <span class="sq" aria-live="polite"><b>${q}</b><small>in cart</small></span>
    <button type="button" data-cardq="1" data-sku="${esc(v.sku)}" aria-label="One more"${atMax ? ' aria-disabled="true" class="max"' : ""}>+</button>
  </div>`;
}
function singleBtnsHTML(v) {
  const q = cartQty(v.sku);
  return (q > 0 ? stepperHTML(v, q) : `<button class="btn" data-add="${esc(v.sku)}">Add to Cart</button>`) + `<button class="btn btn-buy" data-buy="${esc(v.sku)}">Buy Now</button>`;
}
/** Redraws only the buttons of this one product (never the whole list), then puts the keyboard focus back where it was. */
function refreshCardBtns(sku, focus) {
  const f = findVariant(sku); if (!f) return;
  const sel = `[data-btns="${CSS.escape(sku)}"]`;
  document.querySelectorAll(sel).forEach(box => { box.innerHTML = singleBtnsHTML(f.variant); });
  const target = focus === "add" ? `${sel} [data-add]` : `${sel} [data-cardq="${focus === "minus" ? "-1" : "1"}"]`;
  const b = focus ? document.querySelector(target) : null; if (b) { try { b.focus({ preventScroll: true }); } catch {} }
}
function designInCart(p) { return p.variants.some(v => inCart(v.sku)); }
function addToCart(sku, qty = 1, quiet = false) {
  const f = findVariant(sku);
  if (!f || f.variant.stock < 1) return false;
  const cart = getCart();
  const item = cart.find(i => i.id === sku);
  if (item) item.qty = Math.min(item.qty + qty, f.variant.stock);
  else cart.push({ id: sku, qty: Math.min(qty, f.variant.stock) });
  saveCart(cart);
  if (!quiet) toast(`${variantName(f.product, f.variant)} added to cart`);
  return true;
}
function setQty(sku, qty) {
  const f = findVariant(sku);
  let cart = getCart();
  if (qty <= 0) cart = cart.filter(i => i.id !== sku);
  else { const it = cart.find(i => i.id === sku); if (it) it.qty = Math.min(qty, f ? f.variant.stock : qty); }
  saveCart(cart);
}
function cartDetailed() {
  return getCart().map(i => { const f = findVariant(i.id); return f ? { ...i, product: f.product, variant: f.variant } : null; }).filter(Boolean);
}
function cartTotal() {
  return cartDetailed().reduce((s, i) => s + i.variant.price * i.qty, 0);
}
/* After fresh stock arrives: drop sold-out items and trim quantities to what is left */
function reconcileCart() {
  if (!CATALOG.length) return;
  const before = getCart();
  const after = [];
  before.forEach(i => {
    const f = findVariant(i.id);
    if (!f || f.variant.stock < 1) return;
    after.push({ id: i.id, qty: Math.min(i.qty, f.variant.stock) });
  });
  if (JSON.stringify(before) !== JSON.stringify(after)) { saveCart(after); return true; }
  return false;
}
/* ---------- Delivery charge by area (shown before the customer orders) ---------- */
const AREA_OTHER = "other", AREA_OUT = "outside";
function areaValue() { const el = $("#f-area"); return el ? el.value : ""; }
function areaZone() { const v = areaValue(); return !v ? "none" : v === AREA_OTHER ? "other" : v === AREA_OUT ? "outside" : "near"; }
function areaLabel() {
  const v = areaValue();
  if (v === AREA_OTHER) return "Other area in Bhagalpur";
  if (v === AREA_OUT) return "Outside Bhagalpur";
  return v.startsWith("near:") ? v.slice(5) : "";
}
function pinState() {                    // missing | bhagalpur | elsewhere
  const el = $("#f-pin"), v = el ? el.value.trim() : "";
  if (!/^\d{6}$/.test(v)) return "missing";
  return CONFIG.bhagalpurPinPrefixes.some(x => v.startsWith(x)) ? "bhagalpur" : "elsewhere";
}
const nearPinsText = () => CONFIG.nearAreaPins.join(" and ");
function nearPinOk() { const el = $("#f-pin"); return CONFIG.nearAreaPins.includes(el ? el.value.trim() : ""); }
function deliveryQuote(sub) {            // { amount: number | null, state: choose | needpin | pincheck | confirm | ok }
  const zone = areaZone();
  if (sub <= 0) return { amount: 0, state: "ok" };
  if (zone === "none") return { amount: null, state: "choose" };
  if (zone === "outside") return CONFIG.outsideFee > 0 ? { amount: CONFIG.outsideFee, state: "ok" } : { amount: null, state: "confirm" };
  if (pinState() === "elsewhere") return { amount: null, state: "pincheck" };      // Bhagalpur area chosen but PIN code is not Bhagalpur
  if (CONFIG.freeDeliveryAbove && sub >= CONFIG.freeDeliveryAbove) return { amount: 0, state: "ok" };
  if (zone === "near") {                 // the lower fee needs a listed chowk AND one of the near-area PIN codes
    if (pinState() === "missing") return { amount: null, state: "needpin" };
    return { amount: nearPinOk() ? CONFIG.nearAreaFee : CONFIG.otherBhagalpurFee, state: "ok" };
  }
  return { amount: CONFIG.otherBhagalpurFee, state: "ok" };
}
function grandTotal() { const s = cartTotal(); return s - offerDiscount(s) + (deliveryQuote(s).amount || 0); }
function deliveryRangeNote() {
  const out = CONFIG.outsideFee > 0 ? `Outside Bhagalpur: ${money(CONFIG.outsideFee)}.` : "Outside Bhagalpur: we'll confirm the charge on WhatsApp before dispatch.";
  return `Delivery in Bhagalpur: ${money(CONFIG.nearAreaFee)} for our main chowks (PIN ${nearPinsText()} only), ${money(CONFIG.otherBhagalpurFee)} for other areas and PIN codes${CONFIG.freeDeliveryAbove ? `, free on orders of ${money(CONFIG.freeDeliveryAbove)} or more` : ""}. ${out}`;
}
function totalsHTML(forCart) {
  const sub = cartTotal(), disc = offerDiscount(sub);
  const discRow = disc ? `<div class="row disc"><span>Discount (${esc(APPLIED)})</span><span>−${money(disc)}</span></div>` : "";
  const offerHint = OFFER.live && !APPLIED ? `<div class="hint offer-hint" style="margin:-2px 0 10px">${esc(offerShortLine())}, at checkout.</div>` : "";
  if (forCart) {
    return `${freeNudgeHTML(sub)}<div class="row"><span>Subtotal</span><span>${money(sub)}</span></div>${discRow}
    <div class="row"><span>Delivery</span><span>Calculated at checkout</span></div>
    <div class="hint" style="margin:-2px 0 10px">${esc(deliveryRangeNote())} ${esc(deliveryTimeText())}</div>${offerHint}
    <div class="row total"><span>Total (before delivery)</span><span>${money(sub - disc)}</span></div>`;
  }
  const q = deliveryQuote(sub);
  const delText = q.state === "choose" ? "Choose your area" : q.state === "needpin" ? "Enter your PIN code" : q.state === "pincheck" ? "Check your PIN code" : q.state === "confirm" ? "Confirmed on WhatsApp" : q.amount ? money(q.amount) : "FREE";
  const zone = areaZone();
  const hint = q.state === "ok" && q.amount > 0 && (zone === "near" || zone === "other") && CONFIG.freeDeliveryAbove && sub < CONFIG.freeDeliveryAbove
    ? `<div class="hint" style="margin:-2px 0 10px">Add ${money(CONFIG.freeDeliveryAbove - sub)} more for free delivery</div>` : "";
  const complete = q.state === "ok";
  return `<div class="row"><span>Subtotal</span><span>${money(sub)}</span></div>${discRow}
    <div class="row"><span>Delivery</span><span>${delText}</span></div>${hint}
    <div class="row total"><span>${complete ? "Total" : "Total (before delivery)"}</span><span>${money(sub - disc + (q.amount || 0))}</span></div>
    <div class="hint" style="margin:10px 0 0">${esc(deliveryTimeNote())}</div>`;
}
function refreshTotals() { const b = $("#totals-box"); if (b) b.innerHTML = totalsHTML(); refreshCod(); }
/* Cash on delivery only for Bhagalpur: switch it off (and fall back to UPI) when the area or PIN is outside Bhagalpur */
function refreshCod() {
  const opt = $("#cod-opt"); if (!opt) return;
  const inp = opt.querySelector("input"), note = $("#cod-note");
  const blocked = areaZone() === "outside" || pinState() === "elsewhere";
  inp.disabled = blocked; opt.classList.toggle("off", blocked);
  if (blocked && inp.checked) { const u = document.querySelector('input[name="payment"][value="upi"]'); if (u) u.checked = true; }
  if (note) note.textContent = blocked ? "Cash on delivery is available only for addresses in Bhagalpur" : "Pay in cash when your order arrives (Bhagalpur only)";
}
function updateAreaWa() {
  const a = $("#area-wa"); if (!a) return;
  const val = (id) => { const el = $(id); return el ? el.value.trim() : ""; };
  const addr = [val("#f-building"), val("#f-street"), val("#f-city")].filter(Boolean).join(", ") + (val("#f-pin") ? ` - ${val("#f-pin")}` : "");
  const lm = val("#f-landmark");
  const msg = `Hi ${CONFIG.storeName}, I'd like to check my delivery area before ordering.` +
    (addr.replace(/[\s,-]/g, "") ? `\nMy address: ${addr}` : "") + (lm ? `\nNearest landmark: ${lm}` : "") +
    `\nPlease tell me the delivery charge for my area.`;
  a.href = `https://wa.me/${String(CONFIG.whatsappNumber).replace(/\D/g, "")}?text=${encodeURIComponent(msg)}`;
}
function updateAreaHint() {
  const el = $("#area-hint"); if (!el) return;
  const q = deliveryQuote(cartTotal());
  el.textContent = q.state === "pincheck" ? "That PIN code isn't a Bhagalpur PIN code. Please check it, or choose \"Outside Bhagalpur\" as your area."
    : q.state === "confirm" ? "Outside Bhagalpur we'll confirm the delivery charge with you on WhatsApp before dispatching. You pay nothing until you agree."
    : q.state === "needpin" ? `${money(CONFIG.nearAreaFee)} delivery is only for PIN codes ${nearPinsText()}. Other Bhagalpur PIN codes are ${money(CONFIG.otherBhagalpurFee)}. Enter your PIN code to see your charge.`
    : areaZone() === "near" && q.state === "ok" && q.amount === CONFIG.otherBhagalpurFee && !nearPinOk() ? `Your PIN code is not ${CONFIG.nearAreaPins.join(" or ")}, so the ${money(CONFIG.otherBhagalpurFee)} Bhagalpur delivery charge applies.`
    : "Your delivery charge depends on this. Choose the chowk nearest to your address.";
  el.style.color = q.state === "pincheck" ? "#a33" : "";
}
function deliveryText(o) {
  if (o.subtotal === undefined) return "";
  return o.delivery === null ? "to be confirmed on WhatsApp" : o.delivery ? money(o.delivery) : "FREE";
}
function orderTotalsHTML(o) {
  if (o.subtotal === undefined) return `<div class="row total"><span>Total</span><span>${esc(o.total)}</span></div>`;
  const tbc = o.delivery === null;
  return `<div class="row"><span>Subtotal</span><span>${money(o.subtotal)}</span></div>
    ${o.discount > 0 ? `<div class="row disc"><span>Discount${o.code ? " (" + esc(o.code) + ")" : ""}</span><span>−${money(o.discount)}</span></div>` : ""}
    <div class="row"><span>Delivery</span><span>${tbc ? "To be confirmed" : o.delivery ? money(o.delivery) : "FREE"}</span></div>
    <div class="row total"><span>${tbc ? "Total (before delivery)" : "Total"}</span><span>${esc(o.total)}</span></div>`;
}
function upiLink(o) {
  if (!CONFIG.upiId || !o.totalNum) return "";
  return `upi://pay?pa=${CONFIG.upiId}&pn=${encodeURIComponent(CONFIG.upiName || CONFIG.storeName)}&am=${Number(o.totalNum).toFixed(2)}&cu=INR&tn=${encodeURIComponent("Order " + o.id)}`;
}
/* Buttons that open ONE named UPI app directly. The plain upi:// link lets the phone choose, and on many Android phones that is WhatsApp. */
const isAndroid = () => /android/i.test(navigator.userAgent || "");
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent || "") || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function upiAppLinks(o) {
  const base = upiLink(o); if (!base) return [];
  const q = base.slice(base.indexOf("?") + 1);
  if (isAndroid()) {
    const intent = (pkg) => `intent://pay?${q}#Intent;scheme=upi;package=${pkg};end`;
    return [["Google Pay", intent("com.google.android.apps.nbu.paisa.user")], ["PhonePe", intent("com.phonepe.app")], ["Paytm", intent("net.one97.paytm")], ["BHIM", intent("in.org.npci.upiapp")]];
  }
  if (isIOS()) return [["Google Pay", `gpay://upi/pay?${q}`], ["PhonePe", `phonepe://pay?${q}`], ["Paytm", `paytmmp://pay?${q}`]];
  return [];
}
const isDesktop = () => !!(window.matchMedia && matchMedia("(hover: hover) and (pointer: fine)").matches);
function qrSvg(text) {
  try { const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); } catch { return ""; }
}
/* The payment actions: big Pay button (opens the UPI app on a phone), a QR code on computers, the UPI ID, and "I have paid" */
function upiActionsHTML(o) {
  const link = upiLink(o); if (!link) return "";
  const wa = String(CONFIG.whatsappNumber || "").replace(/\D/g, "");
  const amount = o.total || money(o.totalNum);
  const msg = `Hi ${CONFIG.storeName}, I have paid ${amount} for order ${o.id}. Screenshot attached.`;
  const paidBtn = wa ? `<a class="paid-link" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent(msg)}">I have paid: send the screenshot on WhatsApp</a>` : "";
  const apps = (CONFIG.useAppButtons && !isDesktop()) ? upiAppLinks(o) : [];
  // Pay-by-UPI-ID block: used as the backup under the app buttons, and as the main way on computers
  const qr = qrSvg(link);
  const manual = `<div class="pay-steps">
      <p class="pay-amt">Pay <b>${esc(amount)}</b> to</p>
      <div class="pay-id"><strong>${esc(CONFIG.upiId)}</strong> <button type="button" class="copy" data-copy="${esc(CONFIG.upiId)}">Copy ID</button></div>
      ${CONFIG.upiHolder ? `<p class="hint" style="margin:4px 0 10px">Your app will show the name <b>${esc(CONFIG.upiHolder)}</b>. That is correct.</p>` : ""}
      <ol>
        <li>Tap <b>Copy ID</b>, open your UPI app and choose <b>Pay to UPI ID</b> (or "Send money") and paste the ID.</li>
        <li>Enter exactly <b>${esc(amount)}</b> and add the note <b>Order ${esc(o.id)}</b>.</li>
        <li>After paying, tap the button at the bottom and send us the screenshot.</li>
      </ol>
    </div>
    ${qr ? `<div class="qr">${qr}<small>${isDesktop() ? "Scan this with any UPI app on your phone" : "Or scan this: take a screenshot, open your UPI app, tap Scan and choose it from your gallery. The amount is filled in."}</small></div>` : ""}`;
  if (apps.length) {          // one-tap buttons: the app opens with the amount and order note already filled in
    return `<p class="hint pay-sub" style="margin-top:0"><b>Pay ${esc(amount)}: tap the app you use</b></p>
      <div class="pay-apps">${apps.map(([n, u]) => `<a class="btn pay-app" href="${esc(u)}"><span class="pay-logo"><img src="pay-${n.toLowerCase().replace(/\s/g, "")}.png" alt="" onerror="this.parentNode.style.display='none'"></span><span class="pay-name">${n}</span></a>`).join("")}</div>
      <p class="hint pay-sub">Your app opens with the amount filled in.</p>
      <a class="pay-other" href="${link}">Other UPI app</a>
      <details class="pay-fallback"><summary>App shows an error or does not open? Pay with the UPI ID instead</summary>${manual}</details>
      ${paidBtn}`;
  }
  return manual + paidBtn;
}
function payBoxHTML(o) {
  if (o.payment === "cod") {
    return `<div class="pay-box"><h3>Cash on delivery</h3><p class="hint" style="margin:0">Please keep <strong>${esc(o.total)}</strong> ready in cash when your order arrives. There is nothing to pay now.</p></div>`;
  }
  if (o.delivery === null) {
    return `<div class="pay-box"><p class="hint" style="margin:0">We'll confirm your delivery charge on WhatsApp and tell you the final amount.${CONFIG.upiId ? ` Then you can pay by UPI to <strong>${esc(CONFIG.upiId)}</strong> <button type="button" class="copy" data-copy="${esc(CONFIG.upiId)}">Copy</button>, adding order number ${esc(o.id)} in the payment note.` : ""}</p></div>`;
  }
  const actions = upiActionsHTML(o);
  return actions ? `<div class="pay-box"><h3>Complete your payment</h3>${actions}</div>` : "";

function updateBadge() {
  $("#cart-count").textContent = getCart().reduce((s, i) => s + i.qty, 0);

function getOrders() {

function orderWaText(order, intro) {

function waLink(order) {

let toastTimer;

}

  const multi = p.variants.length > 1;
  const added = designInCart(p);
  const pic = firstAvailable(p).photo || p.images[0];
  const colours = p.variants.filter(v => v.colour);
  // one colour: add straight from the card. Several colours: the customer must pick one on the product page.
  const btn = out ? `<button class="btn" disabled>Sold Out</button>`
    : multi ? `<button class="btn ${added ? "in-cart" : ""}" data-open-pick="${esc(p.id)}">${added ? `In Cart: ${p.variants.reduce((n, v) => n + cartQty(v.sku), 0)} ✓ (choose more)` : "Choose colour"}</button>`
    : `<div class="card-btns" data-btns="${esc(p.variants[0].sku)}">${singleBtnsHTML(p.variants[0])}</div>`;
  return `
  <div class="card" data-open="${esc(p.id)}">
    <div class="card-img">
      ${wishBtnHTML(p)}
      ${imgTag(sized(pic, 500), p.name, 'loading="lazy" decoding="async"')}
      ${(p.images[1] && p.images[1] !== pic) ? imgTag(sized(p.images[1], 500), "", 'class="alt" loading="lazy" decoding="async"') : ""}
      ${out ? '<span class="tag">Sold out</span>' : (p.stock <= 3 ? `<span class="tag">Only ${p.stock} left</span>` : "")}
    </div>
    <div class="card-body">
      <span class="cat">${esc(p.category)}</span>
      <h3>${esc(p.name)}</h3>
      ${colours.length > 1 ? `<span class="more-colours">${colours.length} colours: ${esc(colours.slice(0, 3).map(v => v.colour).join(", "))}${colours.length > 3 ? "…" : ""}</span>` : (colours.length ? `<span class="more-colours">${esc(colours[0].colour)}</span>` : "")}
      <span class="price">${p.priceVaries ? "From " : ""}${money(p.price)}</span>
      ${btn}
    </div>
  </div>`;
}

function filteredProducts() {
  let list = activeCategory === "all" ? CATALOG.slice() : CATALOG.filter(p => p.category === activeCategory);
  const q = searchTerm.trim().toLowerCase();
  if (q) list = list.filter(p => (p.name + " " + p.description + " " + p.category + " " + p.variants.map(v => v.colour).join(" ")).toLowerCase().includes(q));
  if (sortMode === "low") list.sort((a, b) => a.price - b.price);
  if (sortMode === "high") list.sort((a, b) => b.price - a.price);
  return list;
}
function gridHTML() {
  const list = filteredProducts();
  return list.length ? `<div class="grid">${list.map(cardHTML).join("")}</div>` : `<div class="empty">No products found.</div>`;
}

/* ---------- Wishlist (saved on this phone only, nothing is sent anywhere) ---------- */
const WISH_KEY = "mg-wish";
let WISH = [];
try { const a = JSON.parse(localStorage.getItem(WISH_KEY)); if (Array.isArray(a)) WISH = a.filter(x => typeof x === "string" && x).slice(0, 200); } catch {}
function wishSave() { try { localStorage.setItem(WISH_KEY, JSON.stringify(WISH)); } catch {} }
const isWished = (id) => WISH.includes(id);
const wishProducts = () => WISH.map(findProduct).filter(Boolean);
const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.3C1.2 8.4 3.2 5 6.6 5c2 0 3.6 1.1 5.4 3.3C13.8 6.1 15.4 5 17.4 5c3.4 0 5.4 3.4 4.1 6.7C19.5 16.4 12 21 12 21z"/></svg>';
const wishLabel = (id, on) => (on ? "Remove from wishlist: " : "Save to wishlist: ") + ((findProduct(id) || {}).name || "");
function wishBtnHTML(p) {
  const on = isWished(p.id);
  return `<button type="button" class="wish${on ? " on" : ""}" data-wish="${esc(p.id)}" aria-pressed="${on}" aria-label="${esc(wishLabel(p.id, on))}">${HEART}</button>`;
}
function wishPaint() {                   // the number in the header and every heart on the page
  const n = catalogLoaded ? wishProducts().length : WISH.length;
  const b = $("#wish-count"); if (b) { b.textContent = n; b.hidden = !n; }
  const l = $("#wish-link"); if (l) l.setAttribute("aria-label", "Wishlist, " + n + " saved");
  document.querySelectorAll("[data-wish]").forEach(el => {
    const on = isWished(el.dataset.wish);
    el.classList.toggle("on", on); el.setAttribute("aria-pressed", on); el.setAttribute("aria-label", wishLabel(el.dataset.wish, on));
  });
}
function wishToggle(id) {
  const i = WISH.indexOf(id);
  if (i >= 0) WISH.splice(i, 1); else WISH.unshift(id);
  wishSave(); wishPaint();
  toast(i >= 0 ? "Removed from your wishlist" : "Saved to your wishlist");
  if (location.hash === "#/wishlist") renderWishlist();         // the saved page drops the piece straight away
}
function wishPrune() {                   // forget pieces that were deleted from the sheet (only when fresh data arrived)
  if (!CATALOG.length) return;
  const keep = WISH.filter(id => findProduct(id));
  if (keep.length !== WISH.length) { WISH = keep; wishSave(); }
}
function renderWishlist() {
  const list = wishProducts();
  app.innerHTML = `
    <div class="container">
      ${backLink(lastShopHash, "Continue shopping")}
      <h2 class="section-title">Your Wishlist</h2>
      ${list.length
        ? `<p class="hint" style="text-align:center;margin:-14px 0 26px">Saved on this phone. Tap the heart again to remove a piece.</p><div class="grid">${list.map(cardHTML).join("")}</div>`
        : `<div class="wish-empty"><h2>Nothing saved yet</h2><p>Tap the heart on any piece to keep it here for later.</p><a class="btn" href="#/">Browse jewellery</a></div>`}
    </div>`;
}
